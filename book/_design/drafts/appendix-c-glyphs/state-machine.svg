<?xml version="1.0" encoding="UTF-8"?>
<!-- Class glyph: STATE-MACHINE. Three states with directed transitions and one self-loop,
     reading as "lifecycle / state machine". Umber Monograph palette; ink + accent only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-labelledby="glyphSmTitle glyphSmDesc">
  <title id="glyphSmTitle">State-machine class glyph</title>
  <desc id="glyphSmDesc">Three circles arranged as states, joined by directed transition arrows, with
    one self-loop returning to its own state in an accent colour — a lifecycle state machine.</desc>
  <defs>
    <marker id="smHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="smHeadA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>
  <!-- transitions -->
  <g fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42,32 C58,24 74,26 82,36" marker-end="url(#smHead)"/>
    <path d="M88,50 C92,70 78,86 64,90" marker-end="url(#smHead)"/>
    <path d="M46,86 C34,78 30,60 32,46" marker-end="url(#smHead)"/>
  </g>
  <!-- self-loop on the top-right state -->
  <path d="M96,26 C112,18 112,42 98,40" fill="none" stroke="#9a3f12" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" marker-end="url(#smHeadA)"/>
  <!-- states -->
  <g fill="#fdfcf9" stroke="#1c1917" stroke-width="2">
    <circle cx="32" cy="34" r="12"/>
    <circle cx="90" cy="38" r="12"/>
    <circle cx="56" cy="92" r="12"/>
  </g>
</svg>
