<?xml version="1.0" encoding="UTF-8"?>
<!-- Class glyph: REGISTRY. Stacked ledger rows with a key column and an append arrow adding a new
     row, reading as "append-only registry / event log". Umber Monograph palette; ink + accent only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-labelledby="glyphRegTitle glyphRegDesc">
  <title id="glyphRegTitle">Registry class glyph</title>
  <desc id="glyphRegDesc">Three stacked ledger rows, each with a small key cell on the left, and an
    accent arrow appending a fourth dashed row below — an append-only registry or event log.</desc>
  <g fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- three existing rows, each with a key column divider -->
    <rect x="22" y="20" width="76" height="18" rx="3"/>
    <line x1="42" y1="20" x2="42" y2="38"/>
    <rect x="22" y="44" width="76" height="18" rx="3"/>
    <line x1="42" y1="44" x2="42" y2="62"/>
    <rect x="22" y="68" width="76" height="18" rx="3"/>
    <line x1="42" y1="68" x2="42" y2="86"/>
    <!-- appended new (dashed) row -->
    <rect x="22" y="92" width="76" height="18" rx="3" stroke="#9a3f12" stroke-dasharray="5 4"/>
  </g>
  <!-- append arrow into the new row -->
  <g fill="none" stroke="#9a3f12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12,78 L12,101 L18,101"/>
    <path d="M13.5,95 L18,101 L13.5,107"/>
  </g>
</svg>
