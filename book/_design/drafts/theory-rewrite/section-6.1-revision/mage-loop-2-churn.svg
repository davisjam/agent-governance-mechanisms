<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-loop-2-churn). SIMPLIFIED loop-specific diagram for section
     6.1 (R3): only the local churn/discovery path. Three boxes read top-to-bottom: Agentic work
     plus a weak environment E -> Governance pressure (churn, escape, intervention) -> Structural
     diagnosis (local defect or missing structure?). Loop [2] is the churn-red feedback loop
     (#b23b3b); it is Balancing (with loop [3]), so it carries a B badge. Colour is redundant with
     the [2] badge and labels, so the figure reads in grayscale. Palette allow-list: churn red
     #b23b3b, ink #1c1917, paper #fdfcf9, panel #f6f4ef, rule #e4e0d8, muted #57534e. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330"
     role="img" aria-labelledby="l2Title l2Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="l2Title">Loop 2 — the churn / discovery loop</title>
  <desc id="l2Desc">A simplified three-step path drawn as a downward chain. Agentic work against a
    weak environment E produces governance pressure — churn, escaped defects, repeated
    intervention — which is then read at structural diagnosis, asking whether the failure is a
    local defect or evidence of missing structure. Loop 2, in churn red and marked as a balancing
    loop, turns pressure into knowledge only when judgment recognises a structural failure
    class.</desc>

  <defs>
    <marker id="l2-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="380" height="330" fill="#fdfcf9"/>

  <!-- header: badge [2] + loop name + B tag -->
  <circle cx="34" cy="34" r="15" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2.4"/>
  <text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#b23b3b">2</text>
  <text x="58" y="30" text-anchor="start" font-size="15" font-weight="700" fill="#1c1917">Churn / discovery loop</text>
  <text x="58" y="47" text-anchor="start" font-size="11.5" font-style="italic" fill="#57534e">pressure reveals missing structure</text>
  <rect x="330" y="20" width="24" height="24" rx="4" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2"/>
  <text x="342" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#b23b3b">B</text>

  <!-- Box 1: Agentic work + weak E -->
  <rect x="40" y="74" width="300" height="52" rx="8" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2"/>
  <text x="190" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Agentic work + weak E</text>

  <!-- arrow 1 -->
  <path d="M190,126 L190,156" fill="none" stroke="#b23b3b" stroke-width="2.4" marker-end="url(#l2-arrow)"/>

  <!-- Box 2: Governance pressure -->
  <rect x="40" y="158" width="300" height="58" rx="8" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2"/>
  <text x="190" y="184" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b23b3b">Governance pressure</text>
  <text x="190" y="203" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">churn &#183; escape &#183; intervention</text>

  <!-- arrow 2 -->
  <path d="M190,216 L190,246" fill="none" stroke="#b23b3b" stroke-width="2.4" marker-end="url(#l2-arrow)"/>

  <!-- Box 3: Structural diagnosis (the scarce act, emphasised) -->
  <rect x="40" y="248" width="300" height="58" rx="8" fill="#f6f4ef" stroke="#b23b3b" stroke-width="2.6"/>
  <text x="190" y="274" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c1917">Structural diagnosis</text>
  <text x="190" y="293" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">local defect, or missing structure?</text>
</svg>
