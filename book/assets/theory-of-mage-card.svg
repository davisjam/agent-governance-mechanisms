<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid, label: theory-of-mage-card). The inside-cover reference card,
     Gang-of-Four style: one page a reader can point to during a talk. Seven labelled panels read
     top to bottom — Problem, Premise, the two Theses side by side, Governance Conversion + Engineering
     Capital side by side, then the Outcome. Mermaid has no idiom for a titled reference card with a
     role kicker over a statement; this is a laid-out grid, not a graph. Colour carries the semantic
     axes used across every MAGE figure: green is modeling / knowledge / environment (the Modeling
     Thesis + the green Outcome), rust is governance / policy / mechanisms (the Alignment Thesis +
     Governance Conversion + the mechanisms that become Engineering Capital), blue frames the driving
     Problem. Palette: Umber Monograph tokens (fleet #2f5169 problem, muted #57534e premise, governed
     green #1f7a4d/#155c38 modeling + outcome, accent #9a3f12 alignment + conversion + capital, ink
     #1c1917 statements, rule #e4e0d8 flow chevrons, page #fdfcf9). Fonts >= 16u. -->
<!-- semantic-families: agent, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760"
     role="group" aria-labelledby="cardTitle cardDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="cardTitle">The Theory of MAGE — a one-page reference card</title>
  <desc id="cardDesc">A reference card titled The Theory of MAGE, with seven labelled panels. Problem:
    How do we safely grant autonomy to commodity intelligence? Premise: Cheap implementation makes
    engineering judgment the scarce resource. Two theses side by side — Modeling Thesis: Bind engineering
    intent into structured models; Alignment Thesis: Bind engineering policy into deterministic
    mechanisms. Below them, side by side — Governance Conversion: Convert recurring failures into
    mechanisms; Engineering Capital: Mechanisms compound as engineering capital. Outcome: Governed
    engineering environments safely scale autonomy. The green panels are the Modeling arm and the
    compounding outcome; the rust panels are the Alignment arm and the mechanisms that compound as
    capital.</desc>

  <defs>
    <marker id="card-chev" viewBox="0 0 12 12" refX="6" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M1,3 L6,8 L11,3" fill="none" stroke="#e4e0d8" stroke-width="2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#fdfcf9"/>
  <rect x="30" y="30" width="940" height="700" rx="16" fill="none" stroke="#e4e0d8" stroke-width="1.5"/>

  <text x="500" y="82" text-anchor="middle" font-size="28" font-weight="700" fill="#1c1917">The Theory of MAGE</text>
  <text x="500" y="112" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">One page to point to — the theory at a glance.</text>

  <!-- flow chevrons down the spine (faint) -->
  <g fill="none" stroke="none">
    <line x1="500" y1="234" x2="500" y2="244" marker-end="url(#card-chev)"/>
    <line x1="500" y1="322" x2="500" y2="332" marker-end="url(#card-chev)"/>
    <line x1="500" y1="566" x2="500" y2="576" marker-end="url(#card-chev)"/>
  </g>

  <!-- PROBLEM (full width, blue frame) -->
  <rect x="70" y="140" width="860" height="92" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="96" y="171" font-size="16" font-weight="700" letter-spacing="2.5" fill="#2f5169">PROBLEM</text>
  <text x="500" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">How do we safely grant autonomy to commodity intelligence?</text>

  <!-- PREMISE (full width, neutral) -->
  <rect x="70" y="248" width="860" height="80" rx="10" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="96" y="277" font-size="16" font-weight="700" letter-spacing="2.5" fill="#57534e">PREMISE</text>
  <text x="500" y="308" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Cheap implementation makes engineering judgment the scarce resource.</text>

  <!-- TWO THESES (side by side) -->
  <rect x="70" y="344" width="418" height="118" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="96" y="374" font-size="16" font-weight="700" letter-spacing="2" fill="#1f7a4d">MODELING THESIS</text>
  <text x="279" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Bind engineering intent into</text>
  <text x="279" y="436" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">structured models.</text>

  <rect x="512" y="344" width="418" height="118" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="538" y="374" font-size="16" font-weight="700" letter-spacing="2" fill="#9a3f12">ALIGNMENT THESIS</text>
  <text x="721" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Bind engineering policy into</text>
  <text x="721" y="436" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">deterministic mechanisms.</text>

  <!-- CONVERSION + CAPITAL (side by side) — both the Alignment/governance arm, so both rust -->
  <rect x="70" y="478" width="418" height="110" rx="10" fill="#f6f4ef" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="96" y="508" font-size="16" font-weight="700" letter-spacing="2" fill="#9a3f12">GOVERNANCE CONVERSION</text>
  <text x="279" y="544" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Convert recurring</text>
  <text x="279" y="570" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">failures into mechanisms.</text>

  <rect x="512" y="478" width="418" height="110" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="538" y="508" font-size="16" font-weight="700" letter-spacing="2" fill="#9a3f12">ENGINEERING CAPITAL</text>
  <text x="721" y="544" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Mechanisms compound</text>
  <text x="721" y="570" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">as engineering capital.</text>

  <!-- OUTCOME (full width, emphasized green) -->
  <rect x="70" y="604" width="860" height="96" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="3.2"/>
  <text x="96" y="635" font-size="16" font-weight="700" letter-spacing="2.5" fill="#155c38">OUTCOME</text>
  <text x="500" y="672" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Governed engineering environments safely scale autonomy.</text>
</svg>
