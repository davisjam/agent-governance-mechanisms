<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the substrate derivation — Task 6's "MAGE follows from the
     machine" drawn end to end. Two property panels (foundation model, blue-fleet; agentic harness,
     governed-green) feed the two thesis boxes (thesis green), whose combination requires the governed
     engineering environment (accent). Mermaid would draw boxes and edges but not the labeled
     derivation arrows or the panel composition. Mirrors concepts.json _hierarchy.substrate_derivation
     (the model this figure projects). Palette: design-tokens (ink/muted, fleet #2f5169+#e7edf3,
     governed #1f7a4d+#e3f0e7, thesis #15803d+#eef7ee, accent #9a3f12+#faf1e6). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"
     role="group" aria-labelledby="sdTitle sdDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="sdTitle">The substrate derivation: properties to theses to environment</title>
  <desc id="sdDesc">Two panels of substrate properties feed two theses, which land in one
    environment. The foundation-model panel lists broad semantic reasoning, probabilistic execution,
    bounded and reconstructed context, and cheap repeated cognition. The agentic-harness panel lists
    tool-mediated action, interposition, lifecycle visibility, and parallel execution. An arrow
    labeled broad, bounded, cheap upkeep runs from the model panel to the Modeling Thesis; an arrow
    labeled probabilistic runs from the model panel to the Alignment Thesis; an arrow labeled
    mediated action and throughput runs from the harness panel to the Alignment Thesis. Both theses
    then flow into the governed engineering environment — what the combination requires.</desc>

  <defs>
    <marker id="sdArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- ===== the two property panels ===== -->
  <!-- foundation model (fleet blue) -->
  <rect x="45" y="42" width="415" height="205" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="68" y="80" font-size="20" font-weight="700" fill="#2f5169">The foundation model</text>
  <text x="68" y="104" font-size="15" font-style="italic" fill="#57534e">a broad, probabilistic reasoner</text>
  <text x="68" y="136" font-size="15" fill="#1c1917">Broad semantic reasoning</text>
  <text x="68" y="164" font-size="15" fill="#1c1917">Probabilistic execution</text>
  <text x="68" y="192" font-size="15" fill="#1c1917">Bounded, reconstructed context</text>
  <text x="68" y="220" font-size="15" fill="#1c1917">Cheap repeated cognition</text>

  <!-- agentic harness (governed green) -->
  <rect x="500" y="42" width="415" height="205" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="523" y="80" font-size="20" font-weight="700" fill="#1f7a4d">The agentic harness</text>
  <text x="523" y="104" font-size="15" font-style="italic" fill="#57534e">tools, lifecycle, interposition</text>
  <text x="523" y="136" font-size="15" fill="#1c1917">Tool-mediated action</text>
  <text x="523" y="164" font-size="15" fill="#1c1917">Interposition — inspect, constrain, deny</text>
  <text x="523" y="192" font-size="15" fill="#1c1917">Lifecycle visibility</text>
  <text x="523" y="220" font-size="15" fill="#1c1917">Parallel execution</text>

  <!-- ===== derivation arrows: properties → theses ===== -->
  <path d="M 200 247 L 200 322" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdArrow)"/>
  <text x="212" y="290" font-size="14" font-style="italic" fill="#57534e">broad · bounded · cheap upkeep</text>

  <path d="M 415 247 L 600 322" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdArrow)"/>
  <text x="548" y="268" font-size="14" font-style="italic" fill="#57534e">probabilistic</text>

  <path d="M 760 247 L 760 322" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdArrow)"/>
  <text x="772" y="290" font-size="14" font-style="italic" fill="#57534e">mediated action · throughput</text>

  <!-- ===== the two theses ===== -->
  <rect x="70" y="330" width="340" height="72" rx="10" fill="#eef7ee" stroke="#15803d" stroke-width="2.5"/>
  <text x="240" y="360" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">The Modeling Thesis</text>
  <text x="240" y="386" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">a compact model to reason through</text>

  <rect x="550" y="330" width="340" height="72" rx="10" fill="#eef7ee" stroke="#15803d" stroke-width="2.5"/>
  <text x="720" y="360" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">The Alignment Thesis</text>
  <text x="720" y="386" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">mechanically enforced intent</text>

  <!-- ===== theses → environment ===== -->
  <path d="M 240 402 L 240 440 L 400 440 L 400 464" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdArrow)"/>
  <path d="M 720 402 L 720 440 L 560 440 L 560 464" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdArrow)"/>

  <rect x="250" y="470" width="460" height="76" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="480" y="502" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">The governed engineering environment</text>
  <text x="480" y="528" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">what the combination requires</text>
</svg>
