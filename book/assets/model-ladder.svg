<?xml version="1.0" encoding="UTF-8"?>
<!-- REDRAW DRAFT (figures-redraw) of model-ladder.svg. Retitled "The Representation Ladder" and given its
     own grammar so it reads as EPISTEMIC (the Modeling Thesis — how representation expands what can be
     reasoned) rather than normative like the determinization frontier. The axis runs human-readable ->
     machine-understandable -> machine-executable. The top rung is "Computable model" (not "Executable
     model"): the ladder is about what INFERENCE becomes possible, not about executable software. Bottom
     labels name what COMPUTATION each rung unlocks: read / query / validate / simulate / prove / execute.
     All-green throughout — the whole ladder lives in the representation lobe of the house colour language.
     Palette: Umber Monograph tokens (governed green #1f7a4d rungs + ramp, #155c38 top rung, ink #1c1917
     names, muted #57534e human-readable end + notes, rule #e4e0d8 connectors, page #fdfcf9). Fonts in the
     16-28 band at the 1000px reference. -->
<!-- semantic-families: modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="group" aria-labelledby="mlTitle mlDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mlTitle">The representation ladder: how richer representation expands what a machine can reason about</title>
  <desc id="mlDesc">A six-rung ladder climbs from left to right over a green ramp whose axis runs from
    human-readable on the left, through machine-understandable, to machine-executable on the right. Each
    rung sits higher than the last and unlocks a stronger kind of computation. Rung one, Documentation —
    prose a reader can read. Rung two, Knowledge graph — entities a tool can query. Rung three, Structured
    model — typed records a tool can validate. Rung four, Behavior model — state machines a tool can
    simulate. Rung five, Reasoning model — invariants a tool can prove. Rung six, Computable model — a model
    a tool can execute and reason over. Climbing the ladder does not merely make the same intent more legible;
    it expands the reasoning the machine can perform over it.</desc>

  <defs>
    <marker id="ml-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <linearGradient id="mlRamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef7f0"/>
      <stop offset="0.55" stop-color="#e3f0e7"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The representation ladder</text>
  <text x="500" y="70" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">How representation expands reasoning.</text>

  <!-- human-readable -> machine-understandable -> machine-executable axis -->
  <text x="90"  y="112" font-size="16" fill="#57534e">HUMAN-READABLE · a person can follow it</text>
  <text x="500" y="112" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">machine-understandable</text>
  <text x="910" y="112" text-anchor="end" font-size="16" fill="#1f7a4d">MACHINE-EXECUTABLE · a tool can run it</text>

  <!-- connectors from each rung down to its ramp column -->
  <g stroke="#e4e0d8" stroke-width="1.5">
    <line x1="142" y1="416" x2="142" y2="452"/>
    <line x1="285" y1="384" x2="285" y2="452"/>
    <line x1="428" y1="352" x2="428" y2="452"/>
    <line x1="572" y1="320" x2="572" y2="452"/>
    <line x1="715" y1="288" x2="715" y2="452"/>
    <line x1="858" y1="256" x2="858" y2="452"/>
  </g>

  <!-- climbing arrows rung-to-rung -->
  <g fill="none" stroke="#1f7a4d" stroke-width="2.2">
    <path d="M206,372 C238,360 244,352 270,342" marker-end="url(#ml-ah)"/>
    <path d="M349,340 C381,328 387,320 413,310" marker-end="url(#ml-ah)"/>
    <path d="M492,308 C524,296 530,288 556,278" marker-end="url(#ml-ah)"/>
    <path d="M636,276 C668,264 673,256 699,246" marker-end="url(#ml-ah)"/>
    <path d="M779,244 C811,232 817,224 843,214" marker-end="url(#ml-ah)"/>
  </g>

  <!-- the six rungs (all green — the representation lobe) -->
  <rect x="69" y="352" width="146" height="64" rx="8" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="142" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Documentation</text>
  <rect x="221" y="320" width="128" height="64" rx="8" fill="#eef7ee" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="285" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Knowledge</text>
  <text x="285" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">graph</text>
  <rect x="364" y="288" width="128" height="64" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="428" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Structured</text>
  <text x="428" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">model</text>
  <rect x="508" y="256" width="128" height="64" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="572" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Behavior</text>
  <text x="572" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">model</text>
  <rect x="651" y="224" width="128" height="64" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="715" y="254" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Reasoning</text>
  <text x="715" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">model</text>
  <rect x="794" y="192" width="128" height="64" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="3"/>
  <text x="858" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Computable</text>
  <text x="858" y="244" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">model</text>

  <!-- the ramp -->
  <rect x="70" y="452" width="860" height="26" rx="7" fill="url(#mlRamp)" stroke="#e4e0d8" stroke-width="1.2"/>

  <!-- bottom labels: what computation each rung unlocks -->
  <g font-size="16" fill="#57534e" text-anchor="middle">
    <text x="142" y="502">read</text>
    <text x="285" y="502">query</text>
    <text x="428" y="502">validate</text>
    <text x="572" y="502">simulate</text>
    <text x="715" y="502">prove</text>
    <text x="858" y="502">execute</text>
  </g>

  <text x="500" y="540" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">Industry has converged on documentation and knowledge graphs; the opportunity lies further up — analyzable, executable models.</text>
</svg>
