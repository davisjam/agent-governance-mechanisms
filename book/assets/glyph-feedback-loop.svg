<?xml version="1.0" encoding="UTF-8"?>
<!-- Class glyph: FEEDBACK-LOOP. A cycle of three nodes with directed arrows around the loop,
     one arc in an accent colour, reading as "observe-and-react / control loop". Umber Monograph
     palette; ink + accent only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-labelledby="glyphLoopTitle glyphLoopDesc">
  <title id="glyphLoopTitle">Feedback-loop class glyph</title>
  <desc id="glyphLoopDesc">Three nodes set around a circle, joined by curved arrows that travel all the
    way around, with the closing observe-to-act arc drawn in an accent colour — an observe-and-react
    control loop.</desc>
  <defs>
    <marker id="loopHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="loopHeadA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>
  <!-- three arcs around the cycle (clockwise): sense -> act -> observe -> back -->
  <g fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64,26 A38 38 0 0 1 96,80" marker-end="url(#loopHead)"/>
    <path d="M92,86 A38 38 0 0 1 32,90" marker-end="url(#loopHead)"/>
  </g>
  <!-- closing accent arc -->
  <path d="M26,84 A38 38 0 0 1 54,25" fill="none" stroke="#9a3f12" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loopHeadA)"/>
  <!-- three nodes on the loop -->
  <g fill="#fdfcf9" stroke="#1c1917" stroke-width="2">
    <circle cx="60" cy="24" r="9"/>
    <circle cx="98" cy="84" r="9"/>
    <circle cx="24" cy="86" r="9"/>
  </g>
</svg>
