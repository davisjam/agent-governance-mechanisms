<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the specification + verification flagship stack as a left-to-right
     pipeline of six parts, colour-grouped by role. The spec (violet — SPEC, CENSUS), the two rigor tiers
     (governed green — PROVE, the exhaustive proof for hairy invariants; fleet blue — LINT + LEVEL, the
     deterministic check for linear ones), and the coverage map back onto the model (accent umber — COVER).
     Palette: Umber Monograph tokens only (violet #7c6bb0/#f2effb, governed #1f7a4d/#e3f0e7, fleet
     #2f5169/#e7edf3, accent #9a3f12/#faf1e6, ink #1c1917, muted #57534e). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="group" aria-labelledby="svTitle svDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="svTitle">The specification + verification stack: model the spec, derive the obligations, discharge each at the right rigor, map coverage back</title>
  <desc id="svDesc">Six parts run left to right. The spec (violet): SPEC models a concurrent lifecycle as
    composed state machines and names the cross-machine invariants; CENSUS derives from the models every
    obligation owed — seams to fuzz, failure edges to inject, invariants to check. The two rigor tiers:
    PROVE (green) discharges the hairy invariants with an exhaustive state-space or temporal check routed by
    each invariant's temporal form; LINT (blue) discharges the linear ones with a blocking semantic check at
    commit, and LEVEL (blue) places each check at the granularity where its property first becomes legible.
    COVER (accent) projects test coverage back onto the model's nodes, so a verified-in-principle invariant
    with no live test is a visible gap, not a comfortable average.</desc>

  <defs>
    <marker id="svArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- header -->
  <text x="44" y="36" font-size="15" font-weight="700" fill="#1c1917">The specification + verification stack — model the spec, discharge each obligation at the rigor its shape demands</text>

  <!-- capability legend (free-floating swatches) -->
  <rect x="44" y="104" width="15" height="15" rx="3" fill="#f2effb" stroke="#7c6bb0" stroke-width="1.5"/>
  <text x="66" y="116" font-size="12.5" fill="#57534e">the spec + its obligations</text>
  <rect x="340" y="104" width="15" height="15" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="362" y="116" font-size="12.5" fill="#57534e">exhaustive proof — hairy invariants</text>
  <rect x="700" y="104" width="15" height="15" rx="3" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
  <text x="722" y="116" font-size="12.5" fill="#57534e">deterministic lint — linear invariants</text>
  <rect x="1040" y="104" width="15" height="15" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="1062" y="116" font-size="12.5" fill="#57534e">coverage map</text>

  <!-- ============ stage boxes ============ -->
  <!-- 1 SPEC -->
  <rect x="44" y="150" width="168" height="78" rx="8" fill="#f2effb" stroke="#7c6bb0" stroke-width="2"/>
  <text x="128" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">SPEC</text>
  <text x="128" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#7c6bb0">state machines</text>
  <!-- 2 CENSUS -->
  <rect x="228" y="150" width="168" height="78" rx="8" fill="#f2effb" stroke="#7c6bb0" stroke-width="2"/>
  <text x="312" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">CENSUS</text>
  <text x="312" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#7c6bb0">obligation set</text>
  <!-- 3 PROVE -->
  <rect x="412" y="150" width="168" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="496" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">PROVE</text>
  <text x="496" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1f7a4d">exhaustive proof</text>
  <!-- 4 LINT -->
  <rect x="596" y="150" width="168" height="78" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="680" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">LINT</text>
  <text x="680" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5169">semantic lint</text>
  <!-- 5 LEVEL -->
  <rect x="780" y="150" width="168" height="78" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="864" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">LEVEL</text>
  <text x="864" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5169">right level</text>
  <!-- 6 COVER -->
  <rect x="964" y="150" width="168" height="78" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="1048" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">COVER</text>
  <text x="1048" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3f12">coverage map</text>

  <!-- ============ per-part action row (free-floating) ============ -->
  <g font-size="12" font-style="italic" fill="#57534e" text-anchor="middle">
    <text x="128" y="252">name the invariants</text>
    <text x="312" y="252">derive what is owed</text>
    <text x="496" y="252">prove the hairy ones</text>
    <text x="680" y="252">lint the linear ones</text>
    <text x="864" y="252">at the legible level</text>
    <text x="1048" y="252">map coverage back</text>
  </g>

  <!-- ============ arrows ============ -->
  <g fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#svArrow)">
    <path d="M14,189 L42,189"/>
    <path d="M212,189 L226,189"/>
    <path d="M396,189 L410,189"/>
    <path d="M580,189 L594,189"/>
    <path d="M764,189 L778,189"/>
    <path d="M948,189 L962,189"/>
  </g>

  <!-- synthesis caption -->
  <text x="600" y="308" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">Every invariant the spec names is discharged at the rigor its shape demands —</text>
  <text x="600" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">and an unexercised one is a named gap, not a guess.</text>
</svg>
