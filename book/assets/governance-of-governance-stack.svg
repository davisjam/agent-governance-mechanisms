<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the governance-of-governance flagship stack as a left-to-right
     pipeline of six parts. Model the estate (violet — GRAPH the controls, REGISTRY the rules), query the
     estate (governed green — CENSUS the coverage, RADIUS the blast radius), grow the estate (governed green —
     INTERPRET a recurring failure into a new control), and deliver it (accent umber — INDEX the enforced
     rule doc). Palette: Umber Monograph tokens only (violet #7c6bb0/#f2effb, governed #1f7a4d/#e3f0e7,
     accent #9a3f12/#faf1e6, ink #1c1917, muted #57534e). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="group" aria-labelledby="ggTitle ggDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ggTitle">The governance-of-governance stack: model the controls, census the coverage, compute the blast radius, convert a recurring failure into a control, hold the rule doc</title>
  <desc id="ggDesc">Six parts run left to right. Model the estate (violet): GRAPH represents each control
    as a node tagged by its trigger and resource footprint, with a conflict edge wherever two controls
    contend over one resource; REGISTRY attaches machine-readable metadata to each governance rule and
    extracts it into a typed registry. Query the estate (governed green): CENSUS classifies every control by
    the target it guards, so a target with zero controls is a re-derived coverage gap; RADIUS makes each
    control declare its substrate assumption, so the blast radius of a change is a computed query. Grow the
    estate (governed green): INTERPRET converts a recurring failure class into a proportionate new control,
    fired on a cadence so the estate grows by design. Deliver it (accent umber): INDEX holds the top-level
    governance document as a numbered, enforced, capped rule index loaded into every agent's boot context.
    The estate is modeled, queried for its blind spots and its change-safety, grown when a failure recurs,
    and delivered as enforced infrastructure.</desc>

  <defs>
    <marker id="ggArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- header -->
  <text x="44" y="36" font-size="19.2" font-weight="700" fill="#1c1917">The governance-of-governance stack — govern the control estate as its own subject</text>

  <!-- capability legend (free-floating swatches) -->
  <rect x="82" y="104" width="15" height="15" rx="3" fill="#f2effb" stroke="#7c6bb0" stroke-width="1.5"/>
  <text x="104" y="116" font-size="19.2" fill="#57534e">model the estate</text>
  <rect x="340" y="104" width="15" height="15" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="362" y="116" font-size="19.2" fill="#57534e">query + grow the estate — coverage, blast radius, new controls</text>
  <rect x="957" y="104" width="15" height="15" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="979" y="116" font-size="19.2" fill="#57534e">deliver it</text>

  <!-- ============ stage boxes (width 160, step 175) ============ -->
  <!-- 1 GRAPH -->
  <rect x="82" y="150" width="160" height="78" rx="8" fill="#f2effb" stroke="#7c6bb0" stroke-width="2"/>
  <text x="162" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">GRAPH</text>
  <text x="162" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#7c6bb0">conflict graph</text>
  <!-- 2 CENSUS -->
  <rect x="257" y="150" width="160" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="337" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">CENSUS</text>
  <text x="337" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1f7a4d">coverage map</text>
  <!-- 3 RADIUS -->
  <rect x="432" y="150" width="160" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="512" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">RADIUS</text>
  <text x="512" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1f7a4d">blast radius</text>
  <!-- 4 INTERPRET -->
  <rect x="607" y="150" width="160" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="687" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">INTERPRET</text>
  <text x="687" y="210" text-anchor="middle" font-size="18.14" font-weight="600" fill="#1f7a4d">failure → control</text>
  <!-- 5 REGISTRY -->
  <rect x="782" y="150" width="160" height="78" rx="8" fill="#f2effb" stroke="#7c6bb0" stroke-width="2"/>
  <text x="862" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">REGISTRY</text>
  <text x="862" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#7c6bb0">rule metadata</text>
  <!-- 6 INDEX -->
  <rect x="957" y="150" width="160" height="78" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="1037" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">INDEX</text>
  <text x="1037" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#9a3f12">enforced doc</text>

  <!-- ============ per-part action row (free-floating) ============ -->
  <g font-size="19.2" font-style="italic" fill="#57534e" text-anchor="middle">
    <text x="162" y="252">who collides with whom</text>
    <text x="337" y="252">which target is bare</text>
    <text x="512" y="252">what a change breaks</text>
    <text x="687" y="252">what recurs becomes a rule</text>
    <text x="862" y="252">prose becomes a model</text>
    <text x="1037" y="252">in every agent boot</text>
  </g>

  <!-- ============ arrows ============ -->
  <g fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#ggArrow)">
    <path d="M54,189 L80,189"/>
    <path d="M244,189 L255,189"/>
    <path d="M419,189 L430,189"/>
    <path d="M594,189 L605,189"/>
    <path d="M769,189 L780,189"/>
    <path d="M944,189 L955,189"/>
  </g>

  <!-- synthesis caption -->
  <text x="600" y="308" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">The control estate is modeled, queried for its blind spots and change-safety, grown when a failure recurs,</text>
  <text x="600" y="328" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">and delivered to every agent as enforced infrastructure.</text>
</svg>
