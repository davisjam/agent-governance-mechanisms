<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: book-map).
     The map of the book: Part 1 sets the frame and forks into the two theses — Part 2 the
     controls, Part 3 the models — which meet in Part 4's daily practice and are grounded in
     Part 5's case study. Palette: Umber Monograph tokens (governed #1f7a4d Part 2,
     fleet #2f5169 Part 3, accent #9a3f12 the grounding case). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 890" width="960" height="890"
     role="group" aria-labelledby="bmTitle bmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="bmTitle">A map of the book — the parts and how they compose</title>
  <desc id="bmDesc">Part 1, The Mindset, sits at the top and introduces the two theses. It
    branches to two parts that work each thesis out: Part 2, The Governed Environment,
    develops the Alignment Thesis as the controls that govern the fleet; Part 3, The Model
    Zoo, develops the Modeling Thesis as the models the fleet reasons through. Both feed
    Part 4, Putting It to Work, the method in daily practice, which leads to Part 5, a MAGE
    case study of DocAble that the book's claims rest on, and then to Part 6, Reflections —
    the theory, implications for software engineering, and conclusion. Below it sits the back
    matter (Part 7: about the author and colophon) and the patterns appendix used as a reference.</desc>

  <defs>
    <marker id="bm-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- Part 1: the frame -->
  <g id="bm-part-1" class="bm-part">
  <rect x="270" y="30" width="420" height="88" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
  <text x="480" y="66" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Part 1 · The Mindset</text>
  <text x="480" y="96" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">the frame, and the two theses</text>
  </g>

  <!-- the fork: one thesis each -->
  <path d="M370,118 C320,140 280,155 250,174" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#bm-ah)"/>
  <path d="M590,118 C640,140 680,155 710,174" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#bm-ah)"/>

  <!-- Part 2: the Alignment Thesis -->
  <g id="bm-part-2" class="bm-part">
  <rect x="20" y="180" width="440" height="88" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="240" y="216" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Part 2 · The Governed Environment</text>
  <text x="240" y="246" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Alignment Thesis: controls that govern</text>
  </g>

  <!-- Part 3: the Modeling Thesis -->
  <g id="bm-part-3" class="bm-part">
  <rect x="500" y="180" width="440" height="88" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="720" y="216" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Part 3 · The Model Zoo</text>
  <text x="720" y="246" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Modeling Thesis: models the fleet reasons through</text>
  </g>

  <!-- both theses meet in practice -->
  <path d="M250,268 C290,290 330,305 372,324" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#bm-ah)"/>
  <path d="M710,268 C670,290 630,305 588,324" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#bm-ah)"/>

  <!-- Part 4: the practice -->
  <g id="bm-part-4" class="bm-part">
  <rect x="270" y="330" width="420" height="88" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
  <text x="480" y="366" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Part 4 · Putting It to Work</text>
  <text x="480" y="396" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">the method in daily practice</text>
  </g>

  <line x1="480" y1="418" x2="480" y2="474" stroke="#1c1917" stroke-width="2" marker-end="url(#bm-ah)"/>

  <!-- Part 5: the grounding case -->
  <g id="bm-part-5" class="bm-part">
  <rect x="270" y="480" width="420" height="88" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="480" y="516" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Part 5 · A MAGE Case Study</text>
  <text x="480" y="546" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">DocAble, end to end: the grounding case</text>
  </g>

  <line x1="480" y1="568" x2="480" y2="624" stroke="#1c1917" stroke-width="2" marker-end="url(#bm-ah)"/>

  <!-- Part 6: reflections (a numbered Part, peer to 1-5) -->
  <g id="bm-part-6" class="bm-part">
  <rect x="270" y="630" width="420" height="88" rx="8" fill="#efeaf4" stroke="#5b4a72" stroke-width="2"/>
  <text x="480" y="666" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Part 6 · Reflections</text>
  <text x="480" y="696" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">theory, implications, conclusion</text>
  </g>

  <line x1="480" y1="718" x2="480" y2="774" stroke="#1c1917" stroke-width="2" marker-end="url(#bm-ah)"/>

  <!-- Part 7: back matter (apparatus — muted, not a numbered Part) -->
  <rect x="270" y="780" width="420" height="88" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="480" y="816" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Part 7 · Back matter</text>
  <text x="480" y="846" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">about the author, colophon, appendix</text>
</svg>
