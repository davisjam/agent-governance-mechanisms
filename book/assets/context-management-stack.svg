<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the context-management flagship stack as a left-to-right pipeline of
     five parts, colour-coded by DURABILITY (the book's durable-vs-2026-transient exemplar). Durable
     infrastructure (governed green — INDEX, HOOK), 2026-transient crutches that ease as models strengthen
     (accent umber — INJECT, NUDGE), and a mixed part (fleet blue — SNIPPET, transient delivery + durable
     enforcement). Palette: Umber Monograph tokens only (governed #1f7a4d/#e3f0e7, accent #9a3f12/#faf1e6,
     fleet #2f5169/#e7edf3, ink #1c1917, muted #57534e). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="group" aria-labelledby="cxTitle cxDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="cxTitle">The context-management stack: deliver the right policy at the moment a decision is due — coloured by what endures and what a stronger model eases</title>
  <desc id="cxDesc">Five parts run left to right, coloured by durability. INJECT (accent, 2026-transient)
    maps the files an agent is about to touch to the constraints that govern them and injects that slice
    into the brief. SNIPPET (fleet blue, mixed) is the registry of mandatory brief snippets asserted at
    dispatch — transient delivery, durable enforcement. INDEX (green, durable) loads the numbered rule index
    into every agent's boot context. HOOK (green, durable) binds a script to the runtime lifecycle so an
    omitted step fires deterministically. NUDGE (accent, 2026-transient) emits at most one tempo-gated policy
    reflection per window. The durable parts are infrastructure regardless of model; the transient parts are
    crutches whose pressure eases as context windows grow and models hold their disciplines.</desc>

  <defs>
    <marker id="cxArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- header -->
  <text x="44" y="36" font-size="15" font-weight="700" fill="#1c1917">The context-management stack — deliver the right policy at the moment a decision is due</text>

  <!-- durability legend (free-floating swatches) -->
  <rect x="90" y="104" width="15" height="15" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="112" y="116" font-size="12.5" fill="#57534e">durable — infrastructure regardless of model</text>
  <rect x="560" y="104" width="15" height="15" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="582" y="116" font-size="12.5" fill="#57534e">2026-transient — eases as models strengthen</text>
  <rect x="1000" y="104" width="15" height="15" rx="3" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
  <text x="1022" y="116" font-size="12.5" fill="#57534e">mixed</text>

  <!-- ============ stage boxes ============ -->
  <!-- 1 INJECT (transient) -->
  <rect x="90" y="150" width="180" height="78" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="180" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">INJECT</text>
  <text x="180" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3f12">file to rules</text>
  <!-- 2 SNIPPET (mixed) -->
  <rect x="300" y="150" width="180" height="78" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="390" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">SNIPPET</text>
  <text x="390" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5169">brief snippets</text>
  <!-- 3 INDEX (durable) -->
  <rect x="510" y="150" width="180" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="600" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">INDEX</text>
  <text x="600" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1f7a4d">boot context</text>
  <!-- 4 HOOK (durable) -->
  <rect x="720" y="150" width="180" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="810" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">HOOK</text>
  <text x="810" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1f7a4d">lifecycle event</text>
  <!-- 5 NUDGE (transient) -->
  <rect x="930" y="150" width="180" height="78" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="1020" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">NUDGE</text>
  <text x="1020" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3f12">tempo-gated</text>

  <!-- ============ per-part action row (free-floating) ============ -->
  <g font-size="12" font-style="italic" fill="#57534e" text-anchor="middle">
    <text x="180" y="252">the task slice</text>
    <text x="390" y="252">safety boilerplate</text>
    <text x="600" y="252">standing baseline</text>
    <text x="810" y="252">fire the omitted step</text>
    <text x="1020" y="252">one nudge per window</text>
  </g>

  <!-- ============ arrows ============ -->
  <g fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#cxArrow)">
    <path d="M60,189 L88,189"/>
    <path d="M270,189 L298,189"/>
    <path d="M480,189 L508,189"/>
    <path d="M690,189 L718,189"/>
    <path d="M900,189 L928,189"/>
  </g>

  <!-- synthesis caption -->
  <text x="600" y="308" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">The durable parts are infrastructure regardless of model; the transient parts</text>
  <text x="600" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">are crutches whose pressure eases as models strengthen.</text>
</svg>
