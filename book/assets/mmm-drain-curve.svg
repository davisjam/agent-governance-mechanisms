<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mmm-drain-curve). The Missing-Model-Metric orphan rate —
     the share of tests whose exercised code reaches no model-anchored symbol — draining
     over eight tracer re-runs as the model-loop modeled each biggest orphan cluster in
     turn: 56 -> 55 -> 52 -> 39 -> 32.2 -> 30.1 -> 20.9 -> 14.9 percent. A dashed reference
     marks the loop's <=10% target. Palette: Umber Monograph tokens (governed #1f7a4d the
     drain line, muted #57534e the target reference, rule #e4e0d8 gridlines, ink text). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"
     role="img" aria-labelledby="mmTitle mmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmTitle">The Missing-Model-Metric drain</title>
  <desc id="mmDesc">A line chart falling from left to right. It plots the Missing-Model-Metric
    orphan rate — the fraction of tests whose exercised code reaches no model-anchored symbol —
    across eight re-runs of the code-to-model tracer over the dispatch and orchestration test
    population. Each re-run follows a model-loop Epic that modeled the biggest remaining orphan
    cluster, so the orphan rate drains: 56 percent at the pilot, then 55, 52, 39, 32.2, 30.1,
    20.9, and 14.9 percent at the latest committed point. Code-to-model coverage rises as the
    mirror image, from 44 to about 85 percent. A dashed line marks the loop's target of 10
    percent or below. The population denominator drifts from 144 to 148 tests across the runs,
    so the series is comparable but not a fixed-N replay.</desc>

  <!-- y gridlines (20% / 40%) + ticks; baseline at 0% -->
  <line x1="130" y1="280" x2="920" y2="280" stroke="#e4e0d8" stroke-width="1"/>
  <line x1="130" y1="180" x2="920" y2="180" stroke="#e4e0d8" stroke-width="1"/>
  <text x="118" y="284" text-anchor="end" font-size="12" fill="#57534e">20%</text>
  <text x="118" y="184" text-anchor="end" font-size="12" fill="#57534e">40%</text>
  <text x="118" y="384" text-anchor="end" font-size="12" fill="#57534e">0%</text>

  <!-- x baseline (0%) -->
  <line x1="130" y1="380" x2="920" y2="380" stroke="#1c1917" stroke-width="1.5"/>

  <!-- loop target reference at 10% -->
  <line x1="130" y1="330" x2="920" y2="330" stroke="#57534e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="912" y="322" text-anchor="end" font-size="12" font-style="italic" fill="#57534e">loop target — orphan rate ≤ 10%</text>

  <!-- the drain line: 56 -> 55 -> 52 -> 39 -> 32.2 -> 30.1 -> 20.9 -> 14.9 -->
  <polyline points="130,100 243,105 356,120 469,185 581,219 694,229.5 807,275.5 920,305.5"
            fill="none" stroke="#1f7a4d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="130" cy="100"   r="5" fill="#1f7a4d"/>
  <circle cx="243" cy="105"   r="5" fill="#1f7a4d"/>
  <circle cx="356" cy="120"   r="5" fill="#1f7a4d"/>
  <circle cx="469" cy="185"   r="5" fill="#1f7a4d"/>
  <circle cx="581" cy="219"   r="5" fill="#1f7a4d"/>
  <circle cx="694" cy="229.5" r="5" fill="#1f7a4d"/>
  <circle cx="807" cy="275.5" r="5" fill="#1f7a4d"/>
  <circle cx="920" cy="305.5" r="5" fill="#1f7a4d"/>

  <!-- value labels above each point (free-floating) -->
  <text x="130" y="88"  text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">56%</text>
  <text x="243" y="93"  text-anchor="middle" font-size="12" fill="#1f7a4d">55%</text>
  <text x="356" y="108" text-anchor="middle" font-size="12" fill="#1f7a4d">52%</text>
  <text x="469" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">39%</text>
  <text x="581" y="207" text-anchor="middle" font-size="12" fill="#1f7a4d">32.2%</text>
  <text x="694" y="217" text-anchor="middle" font-size="12" fill="#1f7a4d">30.1%</text>
  <text x="807" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">20.9%</text>
  <text x="920" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">14.9%</text>

  <!-- x milestone labels -->
  <text x="130" y="406" text-anchor="middle" font-size="11" fill="#57534e">pilot</text>
  <text x="243" y="406" text-anchor="middle" font-size="11" fill="#57534e">baseline</text>
  <text x="356" y="406" text-anchor="middle" font-size="11" fill="#57534e">C1·p4</text>
  <text x="469" y="406" text-anchor="middle" font-size="11" fill="#57534e">wave-1</text>
  <text x="581" y="406" text-anchor="middle" font-size="11" fill="#57534e">cluster-1</text>
  <text x="694" y="406" text-anchor="middle" font-size="11" fill="#57534e">cluster-3</text>
  <text x="807" y="406" text-anchor="middle" font-size="11" fill="#57534e">cluster-2</text>
  <text x="920" y="406" text-anchor="middle" font-size="11" fill="#57534e">cluster-4</text>

  <!-- axis caption -->
  <text x="130" y="440" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">orphan rate (tests whose code reaches no model) · eight tracer re-runs, 2026-07-24 → 07-29 · N drifts 144→148</text>
</svg>
