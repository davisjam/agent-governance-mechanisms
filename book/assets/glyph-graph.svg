<?xml version="1.0" encoding="UTF-8"?>
<!-- Class glyph: GRAPH. A small node-edge graph with crossing edges and one bolded edge,
     reading as "typed graph / traceability". Umber Monograph palette; ink + accent only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-labelledby="glyphGraphTitle glyphGraphDesc">
  <title id="glyphGraphTitle">Graph class glyph</title>
  <desc id="glyphGraphDesc">Five dots joined by edges, several of them crossing, with one edge drawn
    heavier and in an accent colour — a small typed node-edge graph standing for a traceability or
    conflict graph.</desc>
  <g fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- edges (some crossing) -->
    <line x1="30" y1="30" x2="60" y2="60"/>
    <line x1="92" y1="28" x2="60" y2="60"/>
    <line x1="60" y1="60" x2="26" y2="94"/>
    <line x1="60" y1="60" x2="94" y2="92"/>
    <line x1="30" y1="30" x2="94" y2="92"/>
    <!-- one bolded accent edge (crossing the others) -->
    <line x1="92" y1="28" x2="26" y2="94" stroke="#9a3f12" stroke-width="3.4"/>
  </g>
  <g fill="#fdfcf9" stroke="#1c1917" stroke-width="2">
    <circle cx="30" cy="30" r="7"/>
    <circle cx="92" cy="28" r="7"/>
    <circle cx="60" cy="60" r="7.5"/>
    <circle cx="26" cy="94" r="7"/>
    <circle cx="94" cy="92" r="7"/>
  </g>
</svg>
