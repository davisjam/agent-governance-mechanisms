<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-method). The MAGE method at a glance, organizing the
     book's core vocabulary into one flow: the Printer generates code through an agent fleet;
     the two theses (Modeling → models; Alignment → mechanisms) fill a Governed Engineering
     Environment; governance conversion grows that environment into trustworthy software.
     A frontispiece for the glossary. Palette: Umber Monograph tokens (accent #9a3f12 the
     Printer + the outcome, thesis-green #15803d the two theses, fleet #2f5169 the fleet,
     governed #1f7a4d the environment, muted #57534e connectors + gloss). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720"
     role="group" aria-labelledby="mmTitle mmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmTitle">The MAGE method at a glance</title>
  <desc id="mmDesc">A single vertical flow. The Printer — a coding agent — generates code
    through an agent fleet. The fleet branches into the book's two theses: the Modeling Thesis,
    which produces models (the Model Zoo), and the Alignment Thesis, which produces mechanisms
    (constraints, sensors, validators, gates). The two converge into the Governed Engineering
    Environment. Governance conversion grows that environment — turning each recurring failure
    into a mechanism — and the result is trustworthy software.</desc>

  <defs>
    <marker id="mm-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- 1. the Printer -->
  <rect x="280" y="34" width="160" height="54" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="360" y="67" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3f12">The Printer</text>

  <path d="M360,88 L360,130" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>
  <text x="372" y="114" text-anchor="start" font-size="15" font-style="italic" fill="#57534e">generates code</text>

  <!-- 2. the agent fleet -->
  <rect x="255" y="138" width="210" height="46" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="360" y="167" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">The agent fleet</text>

  <!-- branch: fleet -> two theses -->
  <path d="M360,184 L360,208 M175,208 L545,208 M175,208 L175,236 M545,208 L545,236"
        fill="none" stroke="#57534e" stroke-width="2"/>
  <path d="M175,236 L175,242" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>
  <path d="M545,236 L545,242" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>

  <!-- 3a. Modeling Thesis -->
  <rect x="88" y="244" width="174" height="46" rx="8" fill="#eef7ee" stroke="#15803d" stroke-width="2"/>
  <text x="175" y="273" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">Modeling Thesis</text>
  <path d="M175,290 L175,320" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>
  <text x="175" y="342" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">Models</text>
  <text x="175" y="366" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">the Model Zoo</text>

  <!-- 3b. Alignment Thesis -->
  <rect x="458" y="244" width="174" height="46" rx="8" fill="#eef7ee" stroke="#15803d" stroke-width="2"/>
  <text x="545" y="273" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">Alignment Thesis</text>
  <path d="M545,290 L545,320" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>
  <text x="545" y="342" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">Mechanisms</text>
  <text x="545" y="366" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">constraints · sensors</text>
  <text x="545" y="388" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">validators · gates</text>

  <!-- converge: both columns -> GEE -->
  <path d="M175,398 L175,424 M545,398 L545,424 M175,424 L545,424 M360,424 L360,448"
        fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>

  <!-- 4. Governed Engineering Environment -->
  <rect x="150" y="450" width="420" height="54" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="360" y="483" text-anchor="middle" font-size="19" font-weight="700" fill="#1f7a4d">The Governed Engineering Environment</text>

  <path d="M360,504 L360,532" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>
  <text x="360" y="554" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Governance conversion</text>
  <text x="360" y="578" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">grows the environment</text>

  <path d="M360,592 L360,620" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>

  <!-- 5. Trustworthy software -->
  <rect x="222" y="626" width="276" height="50" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="360" y="658" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3f12">Trustworthy software</text>
</svg>
