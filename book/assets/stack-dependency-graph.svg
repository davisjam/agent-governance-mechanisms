<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the seven MAGE engineering stacks and how they depend on one
     another. Edges are EXTRACTED from each stack's own "leans on / feeds / consumes / shares" lines
     (see the edge inventory in appendix-a-draft.md §Figure). Two edge kinds: a solid arrow = one stack
     PROVIDES a guarantee the other CONSUMES (arrow points provider -> consumer, the direction the
     stacks' own "feeds"/"hands to" language runs); a dashed line = two stacks SHARE one member or one
     host, with no provider/consumer direction. Model-coherence is drawn distinct (governed green) as the
     substrate the others trust; everything else fleet blue. Mermaid can draw the DAG but not carry the
     per-edge provenance labels and the substrate-vs-consumer colour split in register.
     Palette: Umber Monograph tokens only (fleet #2f5169/#e7edf3, governed #1f7a4d/#e3f0e7,
     ink #1c1917, muted #57534e). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700"
     role="group" aria-labelledby="sdgTitle sdgDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="sdgTitle">How the seven stacks depend on one another</title>
  <desc id="sdgDesc">A dependency map of the seven MAGE engineering stacks. The model-coherence stack is
    the substrate at the top: it provides the sealed typed door that the provenance and fidelity stack
    stamps, and the executable data that the specification and verification stack's state machines are.
    The specification and verification stack signals a broken invariant to the observe-and-react loop; the
    observe-and-react loop feeds recurring alerts to the governance-of-governance stack for conversion into
    new controls, and its observability bus carries the resource-mediation stack's live pressure signal. Two
    stacks share surfaces rather than depend: the governance-of-governance stack and the context-management
    stack both carry the same boot-context rule index, and the resource-mediation and context-management
    stacks share one host machine among many agents. A solid arrow means one stack provides a guarantee the
    other consumes; a dashed line means two stacks share a member or a host.</desc>

  <defs>
    <marker id="sdgArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
    <marker id="sdgArrowMuted" markerWidth="8" markerHeight="8" refX="6.5" refY="3.0"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.0 L0,6.0 Z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- header -->
  <text x="44" y="38" font-size="21" font-weight="700" fill="#1c1917">How the seven stacks depend on one another</text>
  <text x="44" y="63" font-size="16.5" font-style="italic" fill="#57534e">Each edge is drawn from the stacks' own "leans on / feeds / consumes / shares" lines.</text>

  <!-- ================= edges (drawn first, under the boxes) ================= -->
  <!-- 1  model-coherence -> provenance-fidelity  (provides the sealed door) -->
  <path d="M475,150 C400,172 335,186 305,203" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdgArrow)"/>
  <!-- 2  model-coherence -> specification-verification  (provides executable DATA) -->
  <path d="M685,150 C785,172 850,186 880,203" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdgArrow)"/>
  <!-- 3  specification-verification -> observe-react  (signals a broken invariant) -->
  <path d="M910,300 L910,347" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdgArrow)"/>
  <!-- 4  observe-react -> governance-of-governance  (recurring alerts to convert) -->
  <path d="M910,438 L910,485" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdgArrow)"/>
  <!-- 5  observe-react -> resource-mediation  (pressure signal rides the bus) -->
  <path d="M760,393 L742,393" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#sdgArrow)"/>
  <!-- 6  provenance-fidelity ..> specification-verification  (composes with; weak, dotted) -->
  <path d="M410,259 L758,259" fill="none" stroke="#57534e" stroke-width="1.6" stroke-dasharray="2 5" marker-end="url(#sdgArrowMuted)"/>
  <!-- 7  governance-of-governance <-> context-management  (shares the rule index; dashed, undirected) -->
  <path d="M760,527 L742,527" fill="none" stroke="#57534e" stroke-width="1.8" stroke-dasharray="7 5"/>
  <!-- 8  resource-mediation <-> context-management  (shares one host; dashed, undirected) -->
  <path d="M590,438 L590,485" fill="none" stroke="#57534e" stroke-width="1.8" stroke-dasharray="7 5"/>

  <!-- edge labels -->
  <g font-size="14.5" font-style="italic" fill="#57534e">
    <text x="335" y="182" text-anchor="end">stamps its sealed door</text>
    <text x="825" y="182" text-anchor="start">its state machines are DATA</text>
    <text x="922" y="328" text-anchor="start">signals a broken invariant</text>
    <text x="922" y="466" text-anchor="start">recurring alerts to convert</text>
    <text x="751" y="382" text-anchor="middle">pressure rides the bus</text>
    <text x="584" y="252" text-anchor="middle" fill="#8a857d">composes with</text>
    <text x="751" y="519" text-anchor="middle">shares the rule index</text>
    <text x="600" y="466" text-anchor="start">shares one host</text>
  </g>

  <!-- ================= nodes ================= -->
  <!-- model-coherence (substrate, governed green) -->
  <rect x="430" y="68" width="300" height="82" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="580" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Model coherence</text>
  <text x="580" y="126" text-anchor="middle" font-size="14" fill="#1f7a4d">the typed map, held equal to code</text>

  <!-- provenance-fidelity -->
  <rect x="110" y="203" width="300" height="82" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="260" y="237" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Provenance + fidelity</text>
  <text x="260" y="261" text-anchor="middle" font-size="14" fill="#2f5169">history you can reconstruct</text>

  <!-- specification-verification -->
  <rect x="760" y="203" width="300" height="82" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="910" y="237" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Specification + verification</text>
  <text x="910" y="261" text-anchor="middle" font-size="14" fill="#2f5169">assurance at graded rigor</text>

  <!-- observe-react -->
  <rect x="760" y="347" width="300" height="82" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="910" y="381" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Observe -&gt; react</text>
  <text x="910" y="405" text-anchor="middle" font-size="14" fill="#2f5169">a signal, and what to do</text>

  <!-- resource-mediation -->
  <rect x="440" y="347" width="300" height="82" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="590" y="381" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Resource mediation</text>
  <text x="590" y="405" text-anchor="middle" font-size="14" fill="#2f5169">one host, right parallelism</text>

  <!-- governance-of-governance -->
  <rect x="760" y="485" width="300" height="82" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="910" y="519" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Governance of governance</text>
  <text x="910" y="543" text-anchor="middle" font-size="14" fill="#2f5169">controls as their own subject</text>

  <!-- context-management -->
  <rect x="440" y="485" width="300" height="82" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="590" y="519" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Context management</text>
  <text x="590" y="543" text-anchor="middle" font-size="14" fill="#2f5169">the right policy, at the moment</text>

  <!-- ================= legend ================= -->
  <g font-size="15">
    <line x1="110" y1="628" x2="166" y2="628" stroke="#1c1917" stroke-width="2" marker-end="url(#sdgArrow)"/>
    <text x="176" y="633" fill="#57534e">provides -&gt; consumes (a guarantee flows in the arrow's direction)</text>
    <line x1="110" y1="658" x2="166" y2="658" stroke="#57534e" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="176" y="663" fill="#57534e">shares a member or a host (no direction)</text>
    <rect x="690" y="620" width="15" height="15" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="712" y="633" fill="#57534e">the substrate the others trust</text>
    <rect x="690" y="650" width="15" height="15" rx="3" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="712" y="663" fill="#57534e">a stack built on it</text>
  </g>
</svg>
