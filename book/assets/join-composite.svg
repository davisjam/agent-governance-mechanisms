<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: join-composite).
     The four real panels of the scenarios join — Journey (M13), Selector (M6), Coverage (M5),
     Scheduler (M7) — with only the join edges added between them: criticality derives
     placement, placement joins to coverage, and the deploy Scheduler rations the resulting
     test set per host. Palette: Umber Monograph tokens (fleet #2f5169 machinery,
     accent #9a3f12 criticality + the per-host profile, governed #1f7a4d the plans). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640"
     role="group" aria-labelledby="jcTitle jcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="jcTitle">The scenarios join: journey to selector to coverage to scheduler</title>
  <desc id="jcDesc">A major journey names an endpoint. The Selector derives that endpoint's
    tests to the local-plus-staging tier (a minor one to staging only), and a coverage-floor
    lint fails if a major endpoint has no local test. The coverage model joins to the same
    endpoint node to check it is tested at all. The resulting test set flows to the deploy
    Scheduler, which reads a per-host profile: when only a cost gate applies it fans the
    tests out in parallel; when a cost gate and a scarce host combine it serializes them.</desc>

  <defs>
    <marker id="jc-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="jc-ah-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ===== Journey (M13) ===== -->
  <rect x="20" y="50" width="260" height="310" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="36" y="82" font-size="19" font-weight="700" fill="#1c1917">Journey (M13)</text>

  <rect x="45" y="100" width="210" height="92" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="150" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Journey: goal</text>
  <text x="150" y="166" text-anchor="middle" font-size="18.88" font-weight="600" fill="#9a3f12">criticality: MAJOR</text>

  <line x1="150" y1="196" x2="150" y2="246" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="172" y="226" font-size="18.88" font-style="italic" fill="#57534e">calls</text>

  <polygon points="72,252 240,252 228,308 60,308" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="150" y="286" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">endpoint</text>

  <!-- ===== Selector (M6) ===== -->
  <rect x="320" y="50" width="380" height="450" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="336" y="82" font-size="19" font-weight="700" fill="#1c1917">Selector (M6)</text>

  <!-- endpoint feeds the derivation -->
  <path d="M244,280 C320,250 370,210 424,178" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>

  <polygon points="510,115 590,170 510,225 430,170" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="510" y="177" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">major?</text>

  <path d="M496,222 C478,248 464,260 448,276" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="452" y="252" text-anchor="end" font-size="18.88" font-style="italic" fill="#57534e">yes</text>
  <path d="M524,222 C560,250 580,260 618,276" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="600" y="252" font-size="18.88" font-style="italic" fill="#57534e">no</text>

  <rect x="350" y="280" width="190" height="62" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="445" y="318" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">local + staging</text>

  <rect x="552" y="280" width="150" height="62" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="627" y="318" text-anchor="middle" font-size="18.88" font-weight="700" fill="#1c1917">staging only</text>

  <line x1="445" y1="346" x2="455" y2="392" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>

  <!-- the coverage-floor lint (hexagon) -->
  <polygon points="345,430 372,396 568,396 595,430 568,464 372,464"
           fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="470" y="437" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Coverage-floor lint</text>

  <!-- ===== Coverage (M5) ===== -->
  <rect x="20" y="400" width="260" height="200" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="36" y="432" font-size="19" font-weight="700" fill="#1c1917">Coverage (M5)</text>

  <g>
    <path d="M 55,470 v 70 a 95,10 0 0 0 190,0 v -70" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <ellipse cx="150" cy="470" rx="95" ry="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="150" y="515" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">covered?</text>
  </g>

  <!-- the node join: same endpoint, checked for any test at all -->
  <line x1="200" y1="310" x2="200" y2="452" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#jc-ah-mut)"/>
  <text x="190" y="388" text-anchor="end" font-size="18.88" font-style="italic" fill="#57534e">node join</text>

  <!-- covered? feeds the floor lint -->
  <path d="M247,505 C290,490 310,465 339,436" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>

  <!-- ===== Scheduler (M7) ===== -->
  <rect x="740" y="50" width="420" height="530" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="756" y="82" font-size="19" font-weight="700" fill="#1c1917">Scheduler (M7)</text>

  <rect x="760" y="120" width="200" height="64" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="860" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">plan_for(host)</text>

  <!-- both tiers feed the plan -->
  <path d="M544,296 C640,254 700,192 754,162" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <path d="M706,310 C744,290 732,230 754,182" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>

  <!-- the per-host profile (cylinder) -->
  <g>
    <path d="M 935,230 v 80 a 105,11 0 0 0 210,0 v -80" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <ellipse cx="1040" cy="230" rx="105" ry="11" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="1040" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">HostLoadProfile</text>
    <text x="1040" y="298" text-anchor="middle" font-size="18.88" font-style="italic" fill="#57534e">ceiling · budget</text>
  </g>
  <path d="M1010,224 C980,205 950,198 924,188" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>

  <!-- the plan's two outcomes -->
  <path d="M800,188 C780,260 790,320 848,376" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="880" y="368" font-size="18.88" font-style="italic" fill="#57534e">cost gate only</text>
  <rect x="770" y="380" width="290" height="58" rx="29" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="915" y="417" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">fan out — parallel</text>

  <path d="M780,188 C752,300 755,420 808,486" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="880" y="478" font-size="18.88" font-style="italic" fill="#57534e">cost gate + a scarce host</text>
  <rect x="770" y="490" width="290" height="58" rx="29" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="915" y="527" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">serialize — fan / join</text>
</svg>
