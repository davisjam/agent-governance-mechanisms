<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): a non-graph infographic — two horizontal "net" layers
     spanning the gap between a MODEL band and a CODE band, with two escape hatches drawn as
     GAPS in the net (a hole in the soft layer; a whole region with no net). Mermaid's
     auto-layout draws nodes and edges, not overlapping zones with a mesh-and-holes geometry,
     so this earns the hand-SVG escape hatch. Palette: fleet #2f5169 (soft/reading layer),
     governed #1f7a4d (hard/derived floor), churn #b23b3b (escaping drift + the unmodeled),
     def-blue #1f6fae (census cross-ref). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700"
     role="group" aria-labelledby="msTitle msDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="msTitle">The model-to-code gap spanned by a two-layer net, with two escape hatches</title>
  <desc id="msDesc">Between an upper band (the model, the map) and a lower band (the code, the
    territory) sits the model-to-code gap. Two horizontal nets span it. The upper net is the soft
    reading layer, dashed blue, which catches doc-legible drift but is fallible; it has a hole in the
    middle. The lower net is the hard derived floor, solid green, which resolves each model anchor
    against a live symbol and catches modeled drift; it covers only the modeled region and ends before
    the right-hand zone. Three drift arrows rise from the code toward the model. On the left, a modeled
    drift rises and is caught at the derived floor. In the middle, a subtle semantic drift is
    mechanically green at the floor but slips through the hole in the soft layer and escapes: this is
    failure mode one, the judgment miss. On the right lies a red hatched zone, the unmodeled, which no
    net covers; a drift rises through it unopposed and escapes: this is failure mode two, the unmodeled.
    Below, two cross-references convert the escapes into machinery: a coverage census, or metamodel,
    measures the unmodeled gap; and a self-governance reflex converts the gap into a new model or
    control, extending the derived floor into the formerly-unmodeled zone, drawn as a dashed green
    extension. The caption reads: derived defends, snapshotted drifts, and what is not modeled cannot
    drift-check.</desc>

  <defs>
    <marker id="msArrow" markerWidth="10" markerHeight="10" refX="8" refY="3.4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.4 L0,6.8 Z" fill="#1c1917"/>
    </marker>
    <marker id="msArrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3.4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.4 L0,6.8 Z" fill="#b23b3b"/>
    </marker>
    <marker id="msArrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3.4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.4 L0,6.8 Z" fill="#1f6fae"/>
    </marker>
    <marker id="msArrowGrn" markerWidth="10" markerHeight="10" refX="8" refY="3.4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.4 L0,6.8 Z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <!-- ===== MODEL band (top) ===== -->
  <rect x="40" y="60" width="900" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="490" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">THE MODEL — the map</text>
  <text x="490" y="108" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">typed MBSE models: service-flow · journeys · state machines · governance graph</text>

  <!-- ===== CODE band (bottom of the gap) ===== -->
  <rect x="40" y="470" width="900" height="58" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2"/>
  <text x="490" y="496" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">THE CODE — the territory</text>
  <text x="490" y="518" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">the live symbols the anchors resolve against</text>

  <!-- gap label -->
  <text x="52" y="150" font-size="16" fill="#57534e" font-style="italic">the model↔code gap</text>

  <!-- ===== The UNMODELED zone (right): no net covers it ===== -->
  <rect x="700" y="122" width="240" height="346" rx="6" fill="#fbeaea" stroke="#b23b3b"
        stroke-width="2" stroke-dasharray="7 5"/>
  <text x="820" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#b23b3b">the unmodeled</text>
  <text x="820" y="171" text-anchor="middle" font-size="15.68" fill="#b23b3b">no anchor · no net</text>

  <!-- ===== SOFT layer — the reading pass (dashed blue), with a HOLE at x 430..500 ===== -->
  <text x="70" y="228" font-size="17" font-weight="700" fill="#2f5169">Soft layer — the reading pass</text>
  <text x="70" y="247" font-size="15.68" fill="#57534e">catches doc-legible drift; cannot block</text>
  <!-- left segment 70 → 430 -->
  <line x1="70" y1="262" x2="430" y2="262" stroke="#2f5169" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- right segment 500 → 690 -->
  <line x1="500" y1="262" x2="690" y2="262" stroke="#2f5169" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- mesh ticks on soft layer -->
  <g stroke="#2f5169" stroke-width="1.5" opacity="0.55">
    <line x1="130" y1="255" x2="130" y2="269"/><line x1="210" y1="255" x2="210" y2="269"/>
    <line x1="290" y1="255" x2="290" y2="269"/><line x1="370" y1="255" x2="370" y2="269"/>
    <line x1="560" y1="255" x2="560" y2="269"/><line x1="640" y1="255" x2="640" y2="269"/>
  </g>
  <!-- hole marker -->
  <text x="438" y="250" text-anchor="end" font-size="15.68" fill="#b23b3b" font-style="italic">hole</text>

  <!-- ===== HARD layer — the derived floor (solid green), covers modeled region only (70..690) ===== -->
  <text x="70" y="352" font-size="17" font-weight="700" fill="#1f7a4d">Hard layer — the derived floor (holds)</text>
  <text x="70" y="371" font-size="15.68" fill="#57534e">resolves each anchor to a live symbol</text>
  <line x1="70" y1="388" x2="690" y2="388" stroke="#1f7a4d" stroke-width="4"/>
  <!-- denser mesh ticks on hard floor -->
  <g stroke="#1f7a4d" stroke-width="2" opacity="0.6">
    <line x1="120" y1="380" x2="120" y2="396"/><line x1="180" y1="380" x2="180" y2="396"/>
    <line x1="240" y1="380" x2="240" y2="396"/><line x1="300" y1="380" x2="300" y2="396"/>
    <line x1="360" y1="380" x2="360" y2="396"/><line x1="420" y1="380" x2="420" y2="396"/>
    <line x1="540" y1="380" x2="540" y2="396"/><line x1="600" y1="380" x2="600" y2="396"/>
    <line x1="660" y1="380" x2="660" y2="396"/>
  </g>
  <!-- extended-net: self-governance adds a segment into the unmodeled zone (dashed green) -->
  <line x1="700" y1="388" x2="900" y2="388" stroke="#1f7a4d" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="712" y="356" text-anchor="start" font-size="15.68" fill="#1f7a4d" font-style="italic">extended by self-governance</text>

  <!-- ===== DRIFT arrows rising from CODE (y=470) toward MODEL (y=118) ===== -->
  <!-- 1) modeled drift — CAUGHT at the derived floor -->
  <line x1="180" y1="470" x2="180" y2="396" stroke="#1c1917" stroke-width="2.5" marker-end="url(#msArrow)"/>
  <circle cx="180" cy="388" r="11" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <path d="M174,388 l4,4 l7,-8" fill="none" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="205" y="455" text-anchor="start" font-size="15.68" fill="#1f7a4d" font-weight="700">caught</text>

  <!-- 2) judgment miss — mechanically green at the floor, slips the soft hole, ESCAPES -->
  <line x1="465" y1="470" x2="465" y2="182" stroke="#b23b3b" stroke-width="2.5" stroke-dasharray="2 3" marker-end="url(#msArrowRed)"/>
  <text x="475" y="430" font-size="15.68" fill="#57534e" font-style="italic">mechanically green</text>
  <text x="465" y="150" text-anchor="middle" font-size="15.68" fill="#b23b3b" font-weight="700">escapes</text>
  <text x="465" y="168" text-anchor="middle" font-size="15.68" fill="#b23b3b">fail mode 1: judgment miss</text>

  <!-- 3) unmodeled — no net, ESCAPES unopposed -->
  <line x1="820" y1="468" x2="820" y2="226" stroke="#b23b3b" stroke-width="2.5" marker-end="url(#msArrowRed)"/>
  <text x="820" y="196" text-anchor="middle" font-size="15.68" fill="#b23b3b" font-weight="700">escapes</text>
  <text x="820" y="214" text-anchor="middle" font-size="15.68" fill="#b23b3b">fail mode 2: unmodeled</text>

  <!-- ===== Cross-ref boxes (below the code band) ===== -->
  <!-- Coverage census / metamodel — measures the gap -->
  <rect x="440" y="566" width="300" height="66" rx="8" fill="#eef4fb" stroke="#1f6fae" stroke-width="2"/>
  <text x="590" y="590" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6fae">Coverage census · metamodel</text>
  <text x="590" y="611" text-anchor="middle" font-size="15.68" fill="#57534e">measures the gap: is it modeled at all?</text>
  <!-- arrow from unmodeled zone down to census box -->
  <line x1="755" y1="468" x2="650" y2="564" stroke="#1f6fae" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#msArrowBlue)"/>

  <!-- Self-governance — converts the gap to a new model/control -->
  <rect x="760" y="566" width="180" height="66" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="850" y="590" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a4d">Self-governance</text>
  <text x="850" y="611" text-anchor="middle" font-size="15.68" fill="#57534e">gap → a new model</text>
  <!-- arrow from self-gov box up to the extended net -->
  <line x1="890" y1="564" x2="895" y2="396" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#msArrowGrn)"/>

  <!-- ===== Caption spine ===== -->
  <text x="40" y="672" font-size="18" font-style="italic" font-weight="700" fill="#1c1917">Derived defends, snapshotted drifts — and what isn't modeled can't drift-check.</text>
</svg>
