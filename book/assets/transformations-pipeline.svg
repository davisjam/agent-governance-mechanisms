<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the three skills as three parallel transformation
     chains sharing one skeleton — an input carried to an output through a sequence of sized
     steps. Three stacked lanes with a shared "input → ... → output" spine and per-lane step
     labels; the common skeleton is the takeaway, so the lanes must align column-by-column,
     which Mermaid's three separate flowcharts would not keep in register. Accent #2f5169,
     source-red #b23b3b, cream #faf1e6, panel #e7edf3. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 0 1040 470" width="1040" height="470"
     role="group" aria-labelledby="txTitle txDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="txTitle">The three skills are transformation chains all the way down</title>
  <desc id="txDesc">Each of the three skills carries an input to an output through a sequence of
    sized transformations, sharing one skeleton. Self-communicate starts from the model's language
    weights, then adds rhetorical figures, then the Diataxis writing genre, then the lexicon for
    this context, and leaves the top layer — audience — to you. Self-operate maps an incoming event
    to a kind of activity, transforms it into a design or defect characterization, then into steps,
    then into distinct agent launches with briefs. Self-governance transforms a recurring symptom
    into the mechanism that ends it, one catalogue entry per arrow. The shape is the same across all
    three: a general reasoning task broken into a series of input-to-output steps the model can
    follow, each step sized to the model and the guarantee you need.</desc>

  <defs>
    <marker id="txArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- column input / output caps -->
  <text x="70" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#57534e">input</text>
  <text x="890" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#57534e">output</text>

  <!-- ============ lane rows ============ -->
  <!-- geometry: 4 step-boxes per lane, evenly spaced -->
  <!-- lane 1: self-communicate -->
  <text x="60" y="92" text-anchor="end" font-size="18" font-weight="700" fill="#2f5169">self-</text>
  <text x="60" y="112" text-anchor="end" font-size="18" font-weight="700" fill="#2f5169">communicate</text>
  <g>
    <rect x="150" y="72" width="156" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="228" y="103" text-anchor="middle" font-size="16.64" fill="#1c1917">language weights</text>
    <rect x="330" y="72" width="140" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="400" y="103" text-anchor="middle" font-size="17" fill="#1c1917">figures + genre</text>
    <rect x="510" y="72" width="140" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="580" y="103" text-anchor="middle" font-size="17" fill="#1c1917">the lexicon</text>
    <rect x="690" y="72" width="140" height="52" rx="8" fill="#faf1e6" stroke="#b23b3b" stroke-width="2"/>
    <text x="760" y="95" text-anchor="middle" font-size="17" fill="#1c1917">audience</text>
    <text x="760" y="114" text-anchor="middle" font-size="16.64" font-style="italic" fill="#b23b3b">(you supply)</text>
  </g>

  <!-- lane 2: self-operate -->
  <text x="60" y="210" text-anchor="end" font-size="18" font-weight="700" fill="#2f5169">self-operate</text>
  <g>
    <rect x="150" y="182" width="156" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="228" y="213" text-anchor="middle" font-size="16.64" fill="#1c1917">event → activity</text>
    <rect x="330" y="182" width="140" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="400" y="213" text-anchor="middle" font-size="17" fill="#1c1917">design / defect</text>
    <rect x="510" y="182" width="140" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="580" y="213" text-anchor="middle" font-size="17" fill="#1c1917">steps</text>
    <rect x="690" y="182" width="140" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="760" y="213" text-anchor="middle" font-size="17" fill="#1c1917">agent launches</text>
  </g>

  <!-- lane 3: self-governance -->
  <text x="60" y="320" text-anchor="end" font-size="18" font-weight="700" fill="#2f5169">self-governance</text>
  <g>
    <rect x="150" y="292" width="156" height="52" rx="8" fill="#faf1e6" stroke="#b23b3b" stroke-width="2"/>
    <text x="228" y="323" text-anchor="middle" font-size="17" fill="#1c1917">a symptom</text>
    <rect x="330" y="292" width="320" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="490" y="323" text-anchor="middle" font-size="17" fill="#1c1917">one entry = the transformation</text>
    <rect x="690" y="292" width="140" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="760" y="323" text-anchor="middle" font-size="17" fill="#1c1917">the mechanism</text>
  </g>

  <!-- arrows between boxes, per lane -->
  <g fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#txArrow)">
    <!-- input caps into first box -->
    <path d="M70,50 L70,98 L148,98"/>
    <path d="M70,50 L70,208 L148,208"/>
    <path d="M70,50 L70,318 L148,318"/>
    <!-- lane 1 -->
    <path d="M306,98 L328,98"/><path d="M470,98 L508,98"/><path d="M650,98 L688,98"/>
    <!-- lane 2 -->
    <path d="M306,208 L328,208"/><path d="M470,208 L508,208"/><path d="M650,208 L688,208"/>
    <!-- lane 3 -->
    <path d="M306,318 L328,318"/><path d="M650,318 L688,318"/>
    <!-- last box into output cap -->
    <path d="M830,98 L890,98 L890,50"/>
    <path d="M830,208 L890,208 L890,50"/>
    <path d="M830,318 L890,318 L890,50"/>
  </g>

  <!-- shared takeaway band -->
  <rect x="150" y="392" width="680" height="52" rx="10" fill="none" stroke="#2f5169" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="490" y="416" text-anchor="middle" font-size="19" font-weight="700" fill="#2f5169">One skeleton: a reasoning task broken into sized input-to-output steps</text>
  <text x="490" y="437" text-anchor="middle" font-size="16.64" font-style="italic" fill="#57534e">each step sized to the model and the guarantee you need</text>
</svg>
