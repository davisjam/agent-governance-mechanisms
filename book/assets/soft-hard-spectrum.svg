<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): a gradient spectrum axis with positioned tick labels.
     Mermaid's flowchart would draw boxes-and-arrows but not the continuous soft-to-hard
     gradient with mechanism classes seated along it, which is the figure's point. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="group" aria-labelledby="frbTitle frbDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="frbTitle">Governance runs soft to hard: a compact spectrum of mechanism classes.</title>
  <desc id="frbDesc">A horizontal spectrum runs from soft governance on the left to hard governance on the right. Soft, probabilistic mechanisms that aim an agent sit on the left: conventions, briefs, templates, prose conventions, and a reviewing agent. Judgment-laden doc-derived tests sit in the middle. Deterministic mechanisms that hold the line sit on the right: lints, types, schemas, and quality, drift, or deploy gates, together with a marker file the tool reads. Soft aims the agent; hard holds the line; a mature environment uses both.</desc>
  <defs>
    <linearGradient id="frbGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f4ef"/>
      <stop offset="0.5" stop-color="#faf1e6"/>
      <stop offset="1" stop-color="#9a3f12"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="340" fill="#fdfcf9"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Governance runs soft to hard</text>
  <text x="500" y="72" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">Soft aims the agent; hard holds the line. A mature environment uses both.</text>
  <text x="150" y="112" text-anchor="middle" font-size="16" fill="#57534e">probabilistic · aims an agent</text>
  <text x="850" y="112" text-anchor="middle" font-size="16" fill="#9a3f12">deterministic · holds the line</text>
  <rect x="70" y="126" width="860" height="46" rx="12" fill="url(#frbGrad)" stroke="#e4e0d8" stroke-width="1.5"/>
  <text x="150" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">SOFT</text>
  <text x="850" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#fdfcf9">HARD</text>
  <line x1="150" y1="172" x2="150" y2="196" stroke="#e4e0d8" stroke-width="1.5"/>
  <text x="150" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#57534e">convention · brief</text>
  <text x="150" y="231" text-anchor="middle" font-size="16" font-weight="600" fill="#57534e">template · prose</text>
  <line x1="330" y1="172" x2="330" y2="196" stroke="#2f5169" stroke-width="1.5"/>
  <text x="330" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#2f5169">reviewing agent</text>
  <line x1="500" y1="172" x2="500" y2="196" stroke="#2f5169" stroke-width="1.5"/>
  <text x="500" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#2f5169">doc-derived test</text>
  <line x1="680" y1="172" x2="680" y2="196" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="680" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#9a3f12">lint · type · schema</text>
  <line x1="850" y1="172" x2="850" y2="196" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="850" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#9a3f12">quality / drift / deploy gate ·</text>
  <text x="850" y="231" text-anchor="middle" font-size="16" font-weight="600" fill="#9a3f12">marker file the tool reads</text>
  <text x="500" y="288" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">The second time a soft rule fails, convert it: a documented rule becomes a lint the agent cannot talk past.</text>
  <text x="500" y="314" text-anchor="middle" font-size="16" fill="#155c38">Stronger guardrails let the fleet run faster, safely.</text>
</svg>
