<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif" role="group" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">Loop engineering</title>
  <desc id="loop-desc">A single cycle running left to right. An Input paired with a success metric feeds Agent reasoning, which produces an Output, which feeds back around over the top into the Input. The whole loop is the unit of engineering. The success metric is emphasized in the accent color because defining it is the hard question.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- ===== The three boxes, left-to-right. box width=220, height=100, top y=170, vertical center y=220 ===== -->

  <!-- Input + success metric -->
  <rect x="20" y="170" width="220" height="100" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="130" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Input</text>
  <text x="130" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">+ success metric</text>

  <!-- Agent reasoning -->
  <rect x="300" y="170" width="220" height="100" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="410" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Agent reasoning</text>

  <!-- Output -->
  <rect x="580" y="170" width="220" height="100" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="690" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Output</text>

  <!-- ===== rightward arrows between boxes (centered y=220) ===== -->
  <line x1="240" y1="220" x2="298" y2="220" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="520" y1="220" x2="578" y2="220" stroke="#1c1917" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ===== feedback arc: Output top edge, loop up and over the top, back down into Input top edge ===== -->
  <path d="M 690 170 C 690 40, 130 40, 130 168" fill="none" stroke="#2f5169" stroke-width="2.5" marker-end="url(#ah-accent)"/>
  <text x="410" y="42" text-anchor="middle" font-size="15" fill="#2f5169" font-style="italic">feeds around</text>
</svg>
