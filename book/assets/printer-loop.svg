<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: printer-loop). The production loop: a goal becomes a model,
     the agent (the printer) builds from it, the build is evidence, judgment reads the
     evidence against intent, and the model is sharpened — each pass a better description.
     The same loop shape as the governance-conversion loop; this one PRODUCES, that one
     HARDENS. Palette: Umber Monograph tokens (accent #9a3f12 the model + judgment,
     fleet #2f5169 the agent + evidence, muted #57534e the goal + return path). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 430" width="1250" height="430"
     role="group" aria-labelledby="plTitle plDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="plTitle">The printer loop — the loop that produces</title>
  <desc id="plDesc">A five-step loop drawn left to right. A goal — what you want built —
    becomes a model, the structured description. The agent builds from the model; this is the
    printer running. The build is evidence: what actually came out. Judgment reads the
    evidence against intent, asking whether it matches. A dashed return path runs back from
    judgment to the model, labeled: refine the model, a sharper description each pass. This is
    the same loop shape as the governance-conversion loop — this one produces the work and
    sharpens the model; that one hardens the environment when the loop keeps hitting one wall.</desc>

  <defs>
    <marker id="pl-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="pl-ah-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- 1. goal (center 135) -->
  <rect x="30" y="70" width="210" height="104" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="135" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Goal</text>
  <text x="135" y="142" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">what you want built</text>

  <!-- 2. model (center 380) -->
  <rect x="275" y="70" width="210" height="104" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="380" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Model</text>
  <text x="380" y="142" text-anchor="middle" font-size="16.59" font-style="italic" fill="#57534e">the structured description</text>

  <!-- 3. agent builds (center 625) -->
  <rect x="520" y="70" width="210" height="104" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="625" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Agent builds</text>
  <text x="625" y="142" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">the printer runs</text>

  <!-- 4. evidence (center 870) -->
  <rect x="765" y="70" width="210" height="104" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="870" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Evidence</text>
  <text x="870" y="142" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">what came out</text>

  <!-- 5. judgment (center 1115) -->
  <rect x="1010" y="70" width="210" height="104" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="1115" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Judgment</text>
  <text x="1115" y="142" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">does it match intent?</text>

  <!-- forward arrows -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <path d="M240,122 L271,122" marker-end="url(#pl-ah)"/>
    <path d="M485,122 L516,122" marker-end="url(#pl-ah)"/>
    <path d="M730,122 L761,122" marker-end="url(#pl-ah)"/>
    <path d="M975,122 L1006,122" marker-end="url(#pl-ah)"/>
  </g>

  <!-- dashed return path: judgment -> model -->
  <path d="M1115,174 C1115,300 640,330 380,300 L380,178"
        fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#pl-ah-mut)"/>
  <text x="720" y="345" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">refine the model — a sharper description each pass</text>
</svg>
