<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-loop-4-amplification). SIMPLIFIED loop-specific diagram for
     section 6.1 (R3): only the local capability-amplification path. Four boxes read top-to-bottom:
     Stronger environment -> Larger tasks / more concurrency -> Expanded task frontier -> New
     governance pressure. Loop [4] is the inset-purple feedback loop (#7c6bb0); it is Reinforcing,
     so it carries an R badge. Colour is redundant with the [4] badge and labels, so the figure
     reads in grayscale. Palette allow-list: inset purple #7c6bb0, ink #1c1917, paper #fdfcf9,
     panel #f6f4ef, rule #e4e0d8, muted #57534e. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 384"
     role="img" aria-labelledby="l4Title l4Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="l4Title">Loop 4 — the capability-amplification loop</title>
  <desc id="l4Desc">A simplified four-step path drawn as a downward chain. A stronger environment
    enables larger tasks and more concurrency, which pushes out an expanded task frontier, which
    in turn raises new governance pressure. Loop 4, in inset purple and marked as a reinforcing
    loop, shows how successful governance enables more ambitious work that exposes the next
    unguided surface, so MAGE does not terminate.</desc>

  <defs>
    <marker id="l4-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c6bb0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="380" height="384" fill="#fdfcf9"/>

  <!-- header: badge [4] + loop name + R tag -->
  <circle cx="34" cy="34" r="15" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2.4"/>
  <text x="34" y="40" text-anchor="middle" font-size="9.12" font-weight="700" fill="#7c6bb0">4</text>
  <text x="58" y="30" text-anchor="start" font-size="9.12" font-weight="700" fill="#1c1917">Capability-amplification loop</text>
  <text x="58" y="47" text-anchor="start" font-size="9.12" font-style="italic" fill="#57534e">stronger E enlarges ambition</text>
  <rect x="330" y="20" width="24" height="24" rx="4" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2"/>
  <text x="342" y="38" text-anchor="middle" font-size="9.12" font-weight="700" fill="#7c6bb0">R</text>

  <!-- Box 1: Stronger environment -->
  <rect x="40" y="74" width="300" height="50" rx="8" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2"/>
  <text x="190" y="104" text-anchor="middle" font-size="9.12" font-weight="700" fill="#1c1917">Stronger environment</text>

  <!-- arrow 1 -->
  <path d="M190,124 L190,150" fill="none" stroke="#7c6bb0" stroke-width="2.4" marker-end="url(#l4-arrow)"/>

  <!-- Box 2: Larger tasks / more concurrency -->
  <rect x="40" y="152" width="300" height="50" rx="8" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2"/>
  <text x="190" y="182" text-anchor="middle" font-size="9.12" font-weight="700" fill="#1c1917">Larger tasks &#183; more concurrency</text>

  <!-- arrow 2 -->
  <path d="M190,202 L190,228" fill="none" stroke="#7c6bb0" stroke-width="2.4" marker-end="url(#l4-arrow)"/>

  <!-- Box 3: Expanded task frontier -->
  <rect x="40" y="230" width="300" height="50" rx="8" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2"/>
  <text x="190" y="260" text-anchor="middle" font-size="9.12" font-weight="700" fill="#1c1917">Expanded task frontier</text>

  <!-- arrow 3 -->
  <path d="M190,280 L190,306" fill="none" stroke="#7c6bb0" stroke-width="2.4" marker-end="url(#l4-arrow)"/>

  <!-- Box 4: New governance pressure (reopens the cycle, emphasised) -->
  <rect x="40" y="308" width="300" height="52" rx="8" fill="#f6f4ef" stroke="#7c6bb0" stroke-width="2.6"/>
  <text x="190" y="340" text-anchor="middle" font-size="9.12" font-weight="700" fill="#7c6bb0">New governance pressure</text>
</svg>
