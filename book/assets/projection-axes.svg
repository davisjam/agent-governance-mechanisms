<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: projection-axes).
     REVISION (Part-3 §XII / FIG-3.1-2): the left node is now "one executable model
     SUBSTRATE" — several authoritative source models held equal to the code — NOT one
     universal core/metamodel; and the second fan is scoped as read-side intuition (a slice
     within one framework's rendering, no update path), dropping the overclaimed "lens laws"
     framing. Palette: Umber Monograph tokens (accent #9a3f12 substrate, fleet #2f5169
     projections). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"
     role="group" aria-labelledby="paTitle paDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="paTitle">One executable model substrate, two projection axes — framework and lens</title>
  <desc id="paDesc">At the left sits one executable model substrate: several authoritative source
    models, held equal to the code and drift-gated, not one universal metamodel. A first fan of
    arrows, under the axis label “projection: which framework”, reaches four sibling renderings of
    that substrate — Kruchten’s 4+1 views (this book’s spine), C4 (Context and Container), SysML
    constraint blocks, and a data-flow diagram. From the C4 node a second fan, under the axis label
    “lens: which slice (read-side only)”, reaches three views of the same derived content —
    customer, internal, and privacy/storage. Both fans are read-side projections off the substrate:
    choosing a framework, and choosing a slice within one, are rendering decisions, never a second
    model to maintain. The lens is a reading intuition, not a formal transformation law with an
    update path.</desc>

  <defs>
    <marker id="pa-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- axis labels, as column headers -->
  <text x="550" y="26" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">projection: which framework</text>
  <text x="883" y="80" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">lens: which slice</text>
  <text x="883" y="102" text-anchor="middle" font-size="16" font-style="italic" fill="#9a3f12">read-side only — no update path</text>

  <!-- ===== the one executable model substrate ===== -->
  <rect x="20" y="188" width="312" height="164" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="176" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">One executable</text>
  <text x="176" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">model substrate</text>
  <text x="176" y="280" text-anchor="middle" font-size="17" fill="#57534e">several authoritative models</text>
  <text x="176" y="304" text-anchor="middle" font-size="17" fill="#57534e">held equal to the code</text>
  <text x="176" y="328" text-anchor="middle" font-size="17" fill="#57534e">drift-gated</text>

  <!-- ===== first fan: substrate -> four frameworks ===== -->
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <path d="M336,228 C380,182 392,120 424,86" marker-end="url(#pa-ah)"/>
    <path d="M336,252 C370,238 388,216 424,202" marker-end="url(#pa-ah)"/>
    <path d="M336,278 C370,292 388,306 424,318" marker-end="url(#pa-ah)"/>
    <path d="M336,302 C380,348 392,400 424,434" marker-end="url(#pa-ah)"/>
  </g>

  <g>
    <rect x="430" y="42" width="240" height="80" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="550" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">4+1 views</text>
    <text x="550" y="102" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">this book’s spine</text>

    <rect x="430" y="162" width="240" height="80" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="550" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">C4</text>
    <text x="550" y="222" text-anchor="middle" font-size="18" fill="#57534e">Context · Container</text>

    <rect x="430" y="282" width="240" height="80" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="550" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">SysML</text>
    <text x="550" y="342" text-anchor="middle" font-size="18" fill="#57534e">constraint blocks</text>

    <rect x="430" y="402" width="240" height="80" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="550" y="436" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Data-flow</text>
    <text x="550" y="462" text-anchor="middle" font-size="18" fill="#57534e">diagram</text>
  </g>

  <!-- ===== second fan: C4 -> three lenses (read-side slices) ===== -->
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <path d="M674,190 C720,170 745,150 784,134" marker-end="url(#pa-ah)"/>
    <path d="M674,202 C715,212 745,225 784,238" marker-end="url(#pa-ah)"/>
    <path d="M674,222 C725,260 745,305 784,340" marker-end="url(#pa-ah)"/>
  </g>

  <g>
    <rect x="790" y="118" width="186" height="64" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="883" y="158" text-anchor="middle" font-size="20" fill="#1c1917">customer</text>

    <rect x="790" y="216" width="186" height="64" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="883" y="256" text-anchor="middle" font-size="20" fill="#1c1917">internal</text>

    <rect x="790" y="314" width="186" height="80" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="883" y="348" text-anchor="middle" font-size="20" fill="#1c1917">privacy /</text>
    <text x="883" y="374" text-anchor="middle" font-size="20" fill="#1c1917">storage</text>
  </g>

  <!-- ===== read-side caption spine ===== -->
  <text x="500" y="516" text-anchor="middle" font-size="17" font-style="italic" fill="#1c1917">Framework and lens are both read-side projections off the substrate — never a second model to maintain.</text>
</svg>
