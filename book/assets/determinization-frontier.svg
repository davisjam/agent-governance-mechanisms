<?xml version="1.0" encoding="UTF-8"?>
<!-- REDRAW DRAFT (figures-redraw) of determinization-frontier.svg. Eight rungs now — a Structured Model
     rung inserted between Lint and the model-level machinery — and the ladder is coloured by REPRESENTATION
     SHIFT rather than a flat soft->hard fade: Prompt/Skill/Rule/Lint are gray (implementation-level), the
     Structured Model rung is green (the representation layer, per the house colour language), and Model
     contract/Simulation/Proof are rust (deterministic machinery). A green "expands the frontier" arrow
     carries the Siemens insight — models push determinizability further up the ladder. "Model invariant" is
     renamed "Model contract" (readers may not know invariant); "HARD" is renamed "DETERMINISTIC" (the
     universal property, not MAGE house vocabulary). Bottom labels name what each layer reasons OVER.
     Palette: Umber Monograph tokens (muted gray #57534e implementation rungs + economic note, governed
     green #1f7a4d representation rung, accent #9a3f12 deterministic rungs + climb, ink #1c1917 names,
     rule #e4e0d8 connectors, tint #f3efe7 gray-rung fill/ramp start, tint #e3f0e7 ramp midpoint, page
     #fdfcf9). Fonts in the 16-28 band at the 1000px reference. -->
<!-- semantic-families: governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570"
     role="group" aria-labelledby="dfTitle dfDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dfTitle">The determinization frontier: how far engineering judgment can be compiled into machinery</title>
  <desc id="dfDesc">An eight-rung staircase climbs from left to right. The first four rungs are gray and
    implementation-level: Prompt, which reasons over text; Skill, over workflow; Rule, over policy; Lint,
    over syntax. The fifth rung, Structured Model, is green — the representation layer — and reasons over
    semantics. The last three rungs are rust and deterministic: Model contract, which reasons over
    constraints; Simulation, over behavior; Proof, over mathematics. The gray-and-green left aims the agent
    and remains probabilistic; the rust right holds the line and is deterministic. A green arrow runs from
    the Structured Model rung up toward Simulation and Proof, labelled "expands the frontier": richer models
    push determinizability further up the ladder. The frontier is how far a recurring judgment call has been
    compiled up into machinery the agent cannot talk past.</desc>

  <defs>
    <marker id="df-climb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="df-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="df-cap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <linearGradient id="dfRamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="0.5" stop-color="#e3f0e7"/>
      <stop offset="1" stop-color="#9a3f12"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="570" fill="#fdfcf9"/>
  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The determinization frontier</text>
  <text x="500" y="68" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">How far can engineering judgment be compiled into machinery?</text>

  <text x="90" y="108" font-size="16" fill="#57534e">SOFT · aims the agent · probabilistic</text>
  <text x="910" y="108" text-anchor="end" font-size="16" fill="#9a3f12">DETERMINISTIC · holds the line</text>

  <!-- subtle economic note in the open band above the low rungs -->
  <g>
    <path d="M130,300 L462,240" fill="none" stroke="#57534e" stroke-width="1.6" marker-end="url(#df-cap)"/>
    <text x="292" y="258" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e"
          transform="rotate(-10.3 292 258)">increasing reusable engineering capital</text>
  </g>

  <!-- connectors from each rung down to the ramp -->
  <g stroke="#e4e0d8" stroke-width="1.5">
    <line x1="82"  y1="432" x2="82"  y2="470"/>
    <line x1="200" y1="406" x2="200" y2="470"/>
    <line x1="318" y1="380" x2="318" y2="470"/>
    <line x1="436" y1="354" x2="436" y2="470"/>
    <line x1="554" y1="328" x2="554" y2="470"/>
    <line x1="672" y1="302" x2="672" y2="470"/>
    <line x1="790" y1="276" x2="790" y2="470"/>
    <line x1="908" y1="250" x2="908" y2="470"/>
  </g>

  <!-- climbing arrows rung-to-rung (migrate up one rung) -->
  <g fill="none" stroke="#9a3f12" stroke-width="2">
    <path d="M140,400 C150,392 152,388 162,380" marker-end="url(#df-climb)"/>
    <path d="M258,374 C268,366 270,362 280,354" marker-end="url(#df-climb)"/>
    <path d="M376,348 C386,340 388,336 398,328" marker-end="url(#df-climb)"/>
    <path d="M494,322 C504,314 506,310 516,302" marker-end="url(#df-climb)"/>
    <path d="M612,296 C622,288 624,284 634,276" marker-end="url(#df-climb)"/>
    <path d="M730,270 C740,262 742,258 752,250" marker-end="url(#df-climb)"/>
  </g>

  <!-- the green "expands the frontier" arrow: models push determinizability up the ladder -->
  <path d="M560,262 C660,196 760,180 872,178" fill="none" stroke="#1f7a4d" stroke-width="2.6"
        stroke-dasharray="1 0" marker-end="url(#df-green)"/>
  <text x="712" y="168" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#1f7a4d">expands the frontier</text>

  <!-- rungs 1-4: implementation-level (gray) -->
  <rect x="26"  y="372" width="112" height="60" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="82"  y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Prompt</text>
  <rect x="144" y="346" width="112" height="60" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="200" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Skill</text>
  <rect x="262" y="320" width="112" height="60" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="318" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Rule</text>
  <rect x="380" y="294" width="112" height="60" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="436" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Lint</text>

  <!-- rung 5: the representation layer (green) -->
  <rect x="498" y="268" width="112" height="60" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="554" y="293" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">Structured</text>
  <text x="554" y="313" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">Model</text>

  <!-- rungs 6-8: deterministic machinery (rust) -->
  <rect x="616" y="242" width="112" height="60" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="672" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Model</text>
  <text x="672" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">contract</text>
  <rect x="734" y="216" width="112" height="60" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="790" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Simulation</text>
  <rect x="852" y="190" width="112" height="60" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="3"/>
  <text x="908" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">Proof</text>

  <!-- the ramp -->
  <rect x="26" y="470" width="938" height="24" rx="7" fill="url(#dfRamp)" stroke="#e4e0d8" stroke-width="1.2"/>

  <!-- bottom labels: what each layer reasons over -->
  <g font-size="16" fill="#57534e" text-anchor="middle">
    <text x="82"  y="516">text</text>
    <text x="200" y="516">workflow</text>
    <text x="318" y="516">policy</text>
    <text x="436" y="516">syntax</text>
    <text x="554" y="516">semantics</text>
    <text x="672" y="516">constraints</text>
    <text x="790" y="516">behavior</text>
    <text x="908" y="516">mathematics</text>
  </g>

  <text x="500" y="552" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">The second time a soft rule fails, move it one rung toward machinery the agent cannot talk past.</text>
</svg>
