<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: three-skills).
     One substrate — the agent fleet and its models — with three complementary skills around
     it: self-governance hardens it, self-operate runs it, self-communicate explains it; the
     skills also feed each other. Palette: Umber Monograph tokens (accent #9a3f12 substrate,
     governed #1f7a4d harden, fleet #2f5169 run, panel #f6f4ef explain). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620"
     role="group" aria-labelledby="tsTitle tsDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="tsTitle">Three skills as complements around one substrate</title>
  <desc id="tsDesc">One substrate — the agent fleet and the structured models it reasons
    through — sits at the center. self-governance hardens it, minting mechanisms from
    recurring failures. self-operate runs it, driving the lifecycles of dispatch, land, and
    recover. self-communicate explains it, governing the prose and diagrams the fleet
    produces. The skills also feed each other: a break that recurs during operation is handed
    to self-governance to become a mechanism, and both write their mechanisms and runbooks in
    the register self-communicate governs.</desc>

  <defs>
    <marker id="ts-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="ts-ah-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ===== self-governance (harden) ===== -->
  <rect x="40" y="80" width="320" height="122" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="200" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">self-governance</text>
  <text x="200" y="148" text-anchor="middle" font-size="20" fill="#57534e">HARDEN — mint mechanisms</text>
  <text x="200" y="172" text-anchor="middle" font-size="20" fill="#57534e">from recurring failures</text>

  <!-- ===== self-operate (run) ===== -->
  <rect x="720" y="80" width="320" height="122" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="880" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">self-operate</text>
  <text x="880" y="148" text-anchor="middle" font-size="20" fill="#57534e">RUN — drive the lifecycles:</text>
  <text x="880" y="172" text-anchor="middle" font-size="20" fill="#57534e">dispatch → land → recover</text>

  <!-- ===== the substrate (cylinder, center) ===== -->
  <g>
    <path d="M 390,300 v 90 a 150,14 0 0 0 300,0 v -90" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
    <ellipse cx="540" cy="300" rx="150" ry="14" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
    <text x="540" y="348" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">the substrate</text>
    <text x="540" y="376" text-anchor="middle" font-size="20" fill="#57534e">agent fleet + its models</text>
  </g>

  <!-- ===== self-communicate (explain) ===== -->
  <rect x="380" y="490" width="320" height="112" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
  <text x="540" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">self-communicate</text>
  <text x="540" y="554" text-anchor="middle" font-size="20" fill="#57534e">EXPLAIN — the prose and</text>
  <text x="540" y="578" text-anchor="middle" font-size="20" fill="#57534e">diagrams the fleet produces</text>

  <!-- skills act on the substrate -->
  <path d="M310,206 C360,240 390,258 428,282" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ts-ah)"/>
  <text x="322" y="252" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">guards</text>

  <path d="M770,206 C720,240 690,258 652,282" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#ts-ah)"/>
  <text x="762" y="252" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">operates</text>

  <line x1="540" y1="486" x2="540" y2="428" stroke="#1c1917" stroke-width="2" marker-end="url(#ts-ah)"/>
  <text x="616" y="462" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">documents</text>

  <!-- the skills feed each other -->
  <line x1="716" y1="120" x2="364" y2="120" stroke="#57534e" stroke-width="2" marker-end="url(#ts-ah-mut)"/>
  <text x="540" y="62" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">a break recurs</text>

  <path d="M155,206 C120,340 200,470 374,520 " fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ts-ah-mut)"/>
  <text x="108" y="400" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">writes its</text>
  <text x="108" y="422" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">mechanisms in</text>

  <path d="M925,206 C960,340 880,470 706,520" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ts-ah-mut)"/>
  <text x="978" y="400" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">writes its</text>
  <text x="978" y="422" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">runbooks in</text>
</svg>
