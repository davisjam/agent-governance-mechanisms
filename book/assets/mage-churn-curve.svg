<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: churn-curve). The non-monotonic churn/friction relation.
     Churn/friction (y) against governance apparatus (x): high under-governed, lowest at a
     well-fit environment, rising again from friction in the tower/collision region. The
     descending under-governed arm is ink; the rising tower/collision arm is churn red, so
     the "governance can hurt too" claim reads without colour via the region labels. Palette:
     ink #1c1917 curve + axes, churn red #b23b3b rising arm, rule #e4e0d8 dividers/grid,
     muted #57534e labels, paper #fdfcf9 ground — allow-list only. The exact curve is not
     claimed; the point is non-monotonicity. -->
<svg id="mageChurn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"
     role="img" aria-labelledby="mageChurn-ccTitle mageChurn-ccDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mageChurn-ccTitle">Churn is non-monotonic in governance apparatus</title>
  <desc id="mageChurn-ccDesc">A line chart. The horizontal axis is governance apparatus, increasing to
    the right; the vertical axis is churn or friction, increasing upward. A single U-shaped
    curve is high on the left, falls to a minimum in the middle, and rises again on the right.
    Three regions divide the horizontal axis. On the left, under-governed: churn is high
    because work outruns the environment; this descending arm is drawn in black. In the
    middle, well-fit: churn reaches its lowest point, where the apparatus is proportionate to
    the risk and value it controls. On the right, tower or collision: friction rises again as
    mechanisms duplicate, collide, add latency, raise false positives, and block legitimate
    work; this rising arm is drawn in red. The figure shows that apparatus quantity is not the
    same as effective environment quality — more governance is not monotonically better. The
    exact curve is illustrative, not fitted.</desc>

  <defs>
    <marker id="mageChurn-cc-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#fdfcf9"/>

  <text x="500" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Churn is non-monotonic in governance</text>
  <text x="500" y="70" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">Apparatus quantity is not effective environment quality. More governance is not always better.</text>

  <!-- region divider guides -->
  <line x1="370" y1="100" x2="370" y2="470" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="650" y1="100" x2="650" y2="470" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- axes -->
  <line x1="110" y1="470" x2="952" y2="470" stroke="#1c1917" stroke-width="2" marker-end="url(#mageChurn-cc-axis)"/>
  <line x1="110" y1="470" x2="110" y2="98"  stroke="#1c1917" stroke-width="2" marker-end="url(#mageChurn-cc-axis)"/>

  <!-- axis titles -->
  <text x="530" y="540" text-anchor="middle" font-size="17" font-weight="600" fill="#1c1917">governance apparatus &#8594;</text>
  <text x="52" y="285" text-anchor="middle" font-size="17" font-weight="600" fill="#1c1917" transform="rotate(-90 52 285)">churn / friction &#8593;</text>

  <!-- the curve: descending (under-governed) arm in ink, rising (tower) arm in churn red -->
  <path d="M150,140 C250,300 360,398 500,410" fill="none" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500,410 C640,422 770,340 892,178" fill="none" stroke="#b23b3b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- minimum marker -->
  <circle cx="500" cy="410" r="6" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.5"/>

  <!-- region labels under the axis -->
  <text x="240" y="498" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">under-governed</text>
  <text x="510" y="498" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a4d">well-fit</text>
  <text x="800" y="498" text-anchor="middle" font-size="16" font-weight="700" fill="#b23b3b">tower / collision</text>

  <!-- inline annotations -->
  <text x="196" y="128" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">high churn —</text>
  <text x="196" y="146" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">work outruns E</text>

  <text x="500" y="446" text-anchor="middle" font-size="14" font-style="italic" fill="#1f7a4d">lowest — apparatus fits the risk</text>

  <text x="866" y="150" text-anchor="middle" font-size="14" font-style="italic" fill="#b23b3b">friction rises —</text>
  <text x="866" y="168" text-anchor="middle" font-size="14" font-style="italic" fill="#b23b3b">collision, latency,</text>
  <text x="866" y="186" text-anchor="middle" font-size="14" font-style="italic" fill="#b23b3b">false positives</text>
</svg>
