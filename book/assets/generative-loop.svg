<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: generative-loop).
     One generator, three oracles, all drawing from the shared structured model; every
     counterexample shrinks or RCAs to a spec point, and coverage closes the loop — refining
     the generator and joining model-claim coverage back to the model. Palette: Umber
     Monograph tokens (accent #9a3f12 the model, fleet #2f5169 generator + oracles,
     churn #b23b3b the counterexample, governed #1f7a4d coverage). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 670" width="1180" height="670"
     role="group" aria-labelledby="glTitle glDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="glTitle">One generator, three oracles, one shared model — and a coverage loop</title>
  <desc id="glDesc">A shared structured model — the specification — feeds two of three
    oracles: the declared invariant of a property test, and the structured model itself in
    fuzz plus MBSE. A single input generator feeds all three: the property-test invariant,
    the never-crash fuzzing contract, and the model-based oracle. All three converge on one
    outcome, a counterexample shrunk to its minimal form or RCA'd to the stable
    specification point. That outcome flows into coverage — grammar, line and branch, and
    model-claim — which feeds two dashed loops back: one refining the generator, one joining
    model-claim coverage back to the model, where the metrics chapter owns it.</desc>

  <defs>
    <marker id="gl-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="gl-ah-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ===== the shared model (cylinder, the coin) ===== -->
  <g>
    <path d="M 40,60 v 100 a 150,14 0 0 0 300,0 v -100" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
    <ellipse cx="190" cy="60" rx="150" ry="14" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
    <text x="190" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">shared structured model</text>
    <text x="190" y="140" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">the specification</text>
  </g>

  <!-- ===== the input generator ===== -->
  <rect x="100" y="430" width="220" height="70" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="210" y="473" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">input generator</text>

  <!-- ===== the three oracles ===== -->
  <rect x="430" y="60" width="330" height="400" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="450" y="92" font-size="18" font-style="italic" fill="#57534e">one move, three oracles</text>

  <rect x="460" y="110" width="270" height="84" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="595" y="144" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">declared invariant</text>
  <text x="595" y="172" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">property test</text>

  <rect x="460" y="225" width="270" height="84" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="595" y="259" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">never-crash contract</text>
  <text x="595" y="287" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">fuzz</text>

  <rect x="460" y="340" width="270" height="84" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="595" y="374" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">the structured model</text>
  <text x="595" y="402" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">itself — fuzz + MBSE</text>

  <!-- model -> oracles (the model is the oracle) -->
  <path d="M344,120 C390,125 410,135 452,146" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#gl-ah)"/>
  <path d="M250,180 C300,290 360,340 452,362" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#gl-ah)"/>

  <!-- generator -> all three oracles -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <path d="M324,443 C390,370 415,240 452,178" marker-end="url(#gl-ah)"/>
    <path d="M324,455 C395,420 420,310 452,272" marker-end="url(#gl-ah)"/>
    <path d="M324,468 C380,450 410,420 452,402" marker-end="url(#gl-ah)"/>
  </g>

  <!-- oracles -> the counterexample -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <path d="M734,152 C790,160 800,180 844,200" marker-end="url(#gl-ah)"/>
    <path d="M734,267 C790,260 800,245 844,228" marker-end="url(#gl-ah)"/>
    <path d="M734,382 C800,360 810,300 848,286" marker-end="url(#gl-ah)"/>
  </g>

  <rect x="850" y="170" width="280" height="110" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
  <text x="990" y="205" text-anchor="middle" font-size="19" font-weight="700" fill="#b23b3b">counterexample →</text>
  <text x="990" y="232" text-anchor="middle" font-size="17" fill="#b23b3b">shrink / RCA to the</text>
  <text x="990" y="256" text-anchor="middle" font-size="17" fill="#b23b3b">spec point</text>

  <!-- counterexample -> coverage -->
  <path d="M990,284 C985,340 980,390 978,436" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#gl-ah)"/>

  <rect x="810" y="440" width="340" height="110" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="980" y="478" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">coverage: did we explore?</text>
  <text x="980" y="508" text-anchor="middle" font-size="15.5" fill="#57534e">grammar · line/branch · model-claim</text>

  <!-- the loop closes: coverage refines the generator ... -->
  <path d="M806,510 C560,570 300,560 195,504" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gl-ah-mut)"/>
  <text x="500" y="530" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">refine the generator</text>

  <!-- ... and model-claim coverage joins back to the model -->
  <path d="M806,540 C500,650 140,625 60,440 C 35,320 90,215 148,186" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gl-ah-mut)"/>
  <text x="430" y="652" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">model-claim coverage — the metrics chapter owns it</text>
</svg>
