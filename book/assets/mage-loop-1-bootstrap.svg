<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-loop-1-bootstrap). SIMPLIFIED loop-specific diagram for
     section 6.1 (R3): only the local bootstrap path, not the whole master. Three boxes read
     top-to-bottom: Prior engineering knowledge -> Bootstrap governance -> Governed environment
     E(0). Loop [1] is the blue bootstrap INPUT (fleet blue #2f5169), not a feedback loop, so it
     carries an "input" badge, not R/B. Colour is redundant with the [1] badge and the labels, so
     the figure reads in grayscale. Palette allow-list: fleet blue #2f5169, ink #1c1917, paper
     #fdfcf9, panel #f6f4ef, rule #e4e0d8, muted #57534e. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330"
     role="img" aria-labelledby="l1Title l1Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="l1Title">Loop 1 — the bootstrap path</title>
  <desc id="l1Desc">A simplified three-step path drawn as a downward chain. Prior engineering
    knowledge — standards, requirements, and prior lessons — feeds into bootstrap governance,
    which establishes the initial governed environment E of zero. Loop 1, in fleet blue and
    marked as an input, is not a feedback loop: it sets the initial condition before the fleet
    meets any project-specific failure.</desc>

  <defs>
    <marker id="l1-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="380" height="330" fill="#fdfcf9"/>

  <!-- header: badge [1] + loop name + input tag -->
  <circle cx="34" cy="34" r="15" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.4"/>
  <text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">1</text>
  <text x="58" y="30" text-anchor="start" font-size="15" font-weight="700" fill="#1c1917">Bootstrap path</text>
  <text x="58" y="47" text-anchor="start" font-size="11.5" font-style="italic" fill="#57534e">prior knowledge seeds E(0)</text>
  <rect x="306" y="21" width="56" height="22" rx="11" fill="#fdfcf9" stroke="#2f5169" stroke-width="1.8"/>
  <text x="334" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#2f5169">input</text>

  <!-- Box 1: Prior engineering knowledge -->
  <rect x="40" y="74" width="300" height="58" rx="8" fill="#fdfcf9" stroke="#2f5169" stroke-width="2"/>
  <text x="190" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c1917">Prior engineering knowledge</text>
  <text x="190" y="119" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">standards &#183; requirements &#183; prior lessons</text>

  <!-- arrow 1 -->
  <path d="M190,132 L190,162" fill="none" stroke="#2f5169" stroke-width="2.4" marker-end="url(#l1-arrow)"/>

  <!-- Box 2: Bootstrap governance -->
  <rect x="40" y="164" width="300" height="52" rx="8" fill="#fdfcf9" stroke="#2f5169" stroke-width="2"/>
  <text x="190" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Bootstrap governance</text>

  <!-- arrow 2 -->
  <path d="M190,216 L190,246" fill="none" stroke="#2f5169" stroke-width="2.4" marker-end="url(#l1-arrow)"/>

  <!-- Box 3: Governed environment E(0) (initial state, emphasised) -->
  <rect x="40" y="248" width="300" height="58" rx="8" fill="#f6f4ef" stroke="#2f5169" stroke-width="2.6"/>
  <text x="190" y="274" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c1917">Governed environment</text>
  <text x="190" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">E(0)</text>
</svg>
