<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-loop-3-adaptation). SIMPLIFIED loop-specific diagram for
     section 6.1 (R3): only the local governance-adaptation path. Three boxes read top-to-bottom:
     Structural diagnosis -> Governance adaptation (model, convert, strengthen, reconcile, retire)
     -> Better-shaped environment E(t+1); a return arrow on the right closes the loop, labelled
     "reduces future pressure". Loop [3] is the governed-green feedback loop (#1f7a4d); it is
     Balancing, so it carries a B badge. Colour is redundant with the [3] badge and labels, so the
     figure reads in grayscale. Palette allow-list: governed green #1f7a4d, ink #1c1917, paper
     #fdfcf9, panel #f6f4ef, rule #e4e0d8, muted #57534e. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330"
     role="img" aria-labelledby="l3Title l3Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="l3Title">Loop 3 — the governance-adaptation loop</title>
  <desc id="l3Desc">A simplified three-step path drawn as a downward chain that returns on itself.
    A structural diagnosis triggers governance adaptation — model, convert, strengthen, reconcile,
    retire — which reshapes the environment into a better-shaped E of t plus one. A return arrow
    on the right closes the loop back to diagnosis, labelled "reduces future pressure". Loop 3, in
    governed green and marked as a balancing loop, gives later agents a more legible and
    constrained action space.</desc>

  <defs>
    <marker id="l3-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="440" height="330" fill="#fdfcf9"/>

  <!-- header: badge [3] + loop name + B tag -->
  <circle cx="34" cy="34" r="15" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="34" y="40" text-anchor="middle" font-size="10.56" font-weight="700" fill="#1f7a4d">3</text>
  <text x="58" y="30" text-anchor="start" font-size="10.56" font-weight="700" fill="#1c1917">Governance-adaptation loop</text>
  <text x="58" y="47" text-anchor="start" font-size="11.5" font-style="italic" fill="#57534e">diagnosis reshapes the environment</text>
  <rect x="360" y="20" width="24" height="24" rx="4" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2"/>
  <text x="372" y="38" text-anchor="middle" font-size="10.56" font-weight="700" fill="#1f7a4d">B</text>

  <!-- return arrow (drawn first, behind boxes): E(t+1) right -> up -> back to diagnosis -->
  <path d="M330,277 L400,277 L400,100 L332,100" fill="none" stroke="#1f7a4d" stroke-width="2"
        stroke-linejoin="round" marker-end="url(#l3-arrow)"/>
  <text x="414" y="190" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1f7a4d"
        transform="rotate(-90 414 190)">reduces future pressure</text>

  <!-- Box 1: Structural diagnosis -->
  <rect x="30" y="74" width="300" height="52" rx="8" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2"/>
  <text x="180" y="106" text-anchor="middle" font-size="10.56" font-weight="700" fill="#1c1917">Structural diagnosis</text>

  <!-- arrow 1 -->
  <path d="M180,126 L180,156" fill="none" stroke="#1f7a4d" stroke-width="2.4" marker-end="url(#l3-arrow)"/>

  <!-- Box 2: Governance adaptation -->
  <rect x="30" y="158" width="300" height="58" rx="8" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2"/>
  <text x="180" y="184" text-anchor="middle" font-size="10.56" font-weight="700" fill="#1f7a4d">Governance adaptation</text>
  <text x="180" y="203" text-anchor="middle" font-size="11" font-style="italic" fill="#57534e">model &#183; convert &#183; strengthen &#183; reconcile &#183; retire</text>

  <!-- arrow 2 -->
  <path d="M180,216 L180,246" fill="none" stroke="#1f7a4d" stroke-width="2.4" marker-end="url(#l3-arrow)"/>

  <!-- Box 3: Better-shaped environment E(t+1) (emphasised) -->
  <rect x="30" y="248" width="300" height="58" rx="8" fill="#f6f4ef" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="180" y="274" text-anchor="middle" font-size="10.56" font-weight="700" fill="#1c1917">Better-shaped environment</text>
  <text x="180" y="295" text-anchor="middle" font-size="10.56" font-weight="700" fill="#1f7a4d">E(t+1)</text>
</svg>
