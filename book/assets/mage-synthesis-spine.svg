<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: part6-synthesis-causal-chain). FIRST DRAFT, 260807 — for author review.
     The Part-6 synthesis figure: the whole book's argument as one causal spine, read top to bottom.
     Cheap implementation makes long-horizon reasoning the binding limit; the two theses (Modeling and
     Alignment) answer that limit as a PARALLEL pair (fork/join), and together stand up the Governed
     Engineering Environment; Governance Conversion grows that environment, banking Engineering capital
     that Compounds into trustworthy software. Coordinate-authored: every node and arrow placed by
     explicit x/y (no invisible-anchor / build-helper pattern). Every arrow starts on a source box edge
     and its marker tip lands on the target box edge. Colour is by stroke only (boxes fill paper/panel),
     so the figure survives grayscale; each node also carries a title + gloss, redundant with colour.
     Palette (allow-list, shared with mage-dynamic-model): fleet blue #2f5169, churn red #b23b3b,
     governed green #1f7a4d, inset purple #7c6bb0, ink #1c1917, paper #fdfcf9, panel #f6f4ef,
     rule #e4e0d8, muted #57534e. viewBox 920x1060 -> projected print height 6.17in (< 8.5in page-fit). -->
<svg id="synthSpine" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1060"
     role="img" aria-labelledby="synthSpine-title synthSpine-desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="synthSpine-title">The MAGE argument as one causal spine</title>
  <desc id="synthSpine-desc">A single top-to-bottom causal chain spanning the book's argument. Cheap
    implementation leads to the reasoning-horizon bottleneck: long-horizon reasoning becomes the binding
    limit. That limit is answered by two parallel theses drawn as a fork and join — the Modeling Thesis
    (explicit models the fleet reasons through) and the Alignment Thesis (keep the model equal to the
    code) — which together stand up the Governed Engineering Environment E, the models, controls, and
    query surface. Governance Conversion grows that environment by turning each failure class into a
    durable mechanism; conversion banks Engineering capital, which compounds; and the result is
    trustworthy software, because the discipline lives in the environment. The chain reads top to bottom;
    colour marks the argument's segments and is redundant with each node's title and gloss.</desc>

  <defs>
    <marker id="synthSpine-arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="1060" fill="#fdfcf9"/>

  <!-- ============ title ============ -->
  <text x="460" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">The MAGE argument, end to end</text>
  <text x="460" y="72" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">one causal spine — from the machine to trustworthy software</text>

  <!-- ============ connectors (drawn before boxes; ink spine) ============ -->
  <g stroke="#1c1917" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1  cheap implementation -> reasoning bottleneck -->
    <path d="M460,184 L460,216" marker-end="url(#synthSpine-arrow)"/>
    <!-- 2  fork trunk + bus + droppers into the two theses -->
    <path d="M460,304 L460,340"/>
    <path d="M250,340 L670,340"/>
    <path d="M250,340 L250,368" marker-end="url(#synthSpine-arrow)"/>
    <path d="M670,340 L670,368" marker-end="url(#synthSpine-arrow)"/>
    <!-- 3  join: risers + bus + trunk into the governed environment -->
    <path d="M250,482 L250,504"/>
    <path d="M670,482 L670,504"/>
    <path d="M250,504 L670,504"/>
    <path d="M460,504 L460,516" marker-end="url(#synthSpine-arrow)"/>
    <!-- 4  governed environment -> governance conversion -->
    <path d="M460,632 L460,664" marker-end="url(#synthSpine-arrow)"/>
    <!-- 5  governance conversion -> engineering capital (elbow to the left box) -->
    <path d="M460,756 L460,776 L290,776 L290,792" marker-end="url(#synthSpine-arrow)"/>
    <!-- 6  engineering capital -> compounding (horizontal pair) -->
    <path d="M450,842 L506,842" marker-end="url(#synthSpine-arrow)"/>
    <!-- 7  compounding -> trustworthy software (elbow back to centre) -->
    <path d="M650,888 L650,908 L460,908 L460,926" marker-end="url(#synthSpine-arrow)"/>
  </g>

  <!-- ============ nodes ============ -->

  <!-- 1  Cheap implementation  (the machine / premise — blue) -->
  <rect x="225" y="100" width="470" height="84" rx="9" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.4"/>
  <text x="460" y="137" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Cheap implementation</text>
  <text x="460" y="162" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">implementation is abundant; judgment is scarce</text>

  <!-- 2  Reasoning-horizon bottleneck  (the constraint — red) -->
  <rect x="225" y="220" width="470" height="84" rx="9" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2.4"/>
  <text x="460" y="257" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Reasoning-horizon bottleneck</text>
  <text x="460" y="282" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">long-horizon reasoning is the binding limit</text>

  <!-- 3a  The Modeling Thesis  (parallel pair — purple) -->
  <rect x="80" y="372" width="340" height="110" rx="9" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2.4"/>
  <text x="250" y="406" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">The Modeling Thesis</text>
  <text x="250" y="432" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">explicit models the fleet</text>
  <text x="250" y="452" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">reasons through</text>

  <!-- 3b  The Alignment Thesis  (parallel pair — purple) -->
  <rect x="500" y="372" width="340" height="110" rx="9" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2.4"/>
  <text x="670" y="406" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">The Alignment Thesis</text>
  <text x="670" y="432" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">keep the model equal</text>
  <text x="670" y="452" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">to the code</text>

  <!-- 4  The Governed Engineering Environment  (the hub — green, thicker) -->
  <rect x="225" y="520" width="470" height="112" rx="9" fill="#f6f4ef" stroke="#1f7a4d" stroke-width="3.2"/>
  <text x="460" y="553" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">The Governed Engineering</text>
  <text x="460" y="578" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Environment <tspan fill="#1f7a4d">(E)</tspan></text>
  <text x="460" y="606" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">models &#183; controls &#183; query surface</text>

  <!-- 5  Governance Conversion  (the growth engine — green) -->
  <rect x="225" y="668" width="470" height="88" rx="9" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="460" y="705" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Governance Conversion</text>
  <text x="460" y="730" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">each failure class &#8594; a durable mechanism</text>

  <!-- 6a  Engineering capital  (the banked stock — ink) -->
  <rect x="130" y="796" width="320" height="92" rx="9" fill="#fdfcf9" stroke="#1c1917" stroke-width="2.4"/>
  <text x="290" y="831" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Engineering capital</text>
  <text x="290" y="856" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">accumulation that lowers cost</text>

  <!-- 6b  Compounding  (the reinforcing payoff — purple) -->
  <rect x="510" y="796" width="280" height="92" rx="9" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2.4"/>
  <text x="650" y="831" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Compounding</text>
  <text x="650" y="856" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">capital pays for later work</text>

  <!-- 7  Trustworthy software  (the destination — green, thicker) -->
  <rect x="225" y="930" width="470" height="92" rx="9" fill="#f6f4ef" stroke="#1f7a4d" stroke-width="3.2"/>
  <text x="460" y="965" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Trustworthy software</text>
  <text x="460" y="990" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">the discipline lives in the environment</text>
</svg>
