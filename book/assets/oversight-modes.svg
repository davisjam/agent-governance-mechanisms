<!-- Hand-authored (not Mermaid): three panels in a TRIANGLE — the two poles on top,
     the synthesis centered beneath them — each with its own bespoke geometry: a role
     cycle, a bent human round-trip, and an enclosing environment box. Mermaid's
     auto-layout cannot place a ring, a straddling round-trip, and a containing rounded
     box in a 2-top / 1-bottom-center triangle and keep them small.
     Redrawn from the ICSE-27 TikZ figure "Dominant process models for agentic SE"
     (figures/existing-models.tex, \label{fig:background:existing-theories}),
     panels (a) Velocity-Centric, (b) Oversight-Centric, (c) Governance-Centric.
     Palette matches the book accent (#2f5169). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" width="1180" height="820"
     role="group" aria-labelledby="omTitle omDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="omTitle">Three process models for agentic software engineering</title>
  <desc id="omDesc">Three panels arranged as a triangle. The two poles sit on top:
    velocity-centric at top-left — a human sets a goal, then a ring of role-labeled agents —
    planner, developer, tester, reviewer, security, deploy — passes work around a cycle, with
    insufficient quality control; and oversight-centric at top-right — a human and a single
    agent exchange a prompt and an output in a round trip, so human attention gates every step
    of progress. Governance-centric sits centered beneath them as the synthesis: a human hands
    policies into a governed engineering environment that contains the agent, so known
    obligations become controls before the agent works. The book takes the third stance.</desc>

  <defs>
    <marker id="omArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- faint synthesis connectors: from the two top corners down to the governance panel -->
  <g fill="none" stroke="#e4e0d8" stroke-width="2" stroke-dasharray="5,7">
    <path d="M295,470 C360,545 470,560 560,590"/>
    <path d="M885,470 C820,545 710,560 620,590"/>
  </g>

  <!-- ============ (a) Velocity-centric: role ring (top-left) ============ -->
  <text x="295" y="46" text-anchor="middle" font-size="38" font-weight="700" fill="#1c1917">(a) Velocity-centric</text>
  <g font-size="28" fill="#1c1917" text-anchor="middle">
    <text x="295" y="112" font-weight="700">Human</text>
    <text x="295" y="144" font-size="22" font-style="italic" fill="#57534e">goal ↓</text>

    <!-- six roles around a cycle -->
    <text x="295" y="196">Planner</text>
    <text x="411" y="256">Developer</text>
    <text x="411" y="336">Tester</text>
    <text x="295" y="396">Reviewer</text>
    <text x="179" y="336">Security</text>
    <text x="179" y="256">Deploy</text>

    <!-- cycle arrows (clockwise) -->
    <g fill="none" stroke="#1c1917" stroke-width="1.5" marker-end="url(#omArrow)">
      <path d="M345,202 C383,214 403,232 406,236"/>
      <path d="M431,276 C437,296 437,306 435,311"/>
      <path d="M413,350 C403,366 383,384 359,391"/>
      <path d="M243,398 C207,388 187,370 183,363"/>
      <path d="M161,322 C155,306 155,290 156,287"/>
      <path d="M177,246 C187,232 207,214 234,206"/>
    </g>
  </g>
  <text x="295" y="446" text-anchor="middle" font-size="24" font-style="italic" fill="#b23b3b">Insufficient quality control</text>

  <!-- ============ (b) Oversight-centric: round trip (top-right) ============ -->
  <text x="885" y="46" text-anchor="middle" font-size="38" font-weight="700" fill="#1c1917">(b) Oversight-centric</text>
  <g font-size="28" fill="#1c1917">
    <text x="753" y="266" text-anchor="middle" font-weight="700">Human</text>
    <text x="1017" y="258" text-anchor="middle">Agent:</text>
    <text x="1017" y="290" text-anchor="middle" font-size="22" fill="#57534e">bounded work</text>

    <g fill="none" stroke="#1c1917" stroke-width="1.5" marker-end="url(#omArrow)">
      <path d="M811,240 C871,206 899,206 959,240"/>
      <path d="M959,282 C899,316 871,316 811,282"/>
    </g>
    <text x="885" y="196" text-anchor="middle" font-size="22" font-style="italic" fill="#57534e">prompt</text>
    <text x="885" y="348" text-anchor="middle" font-size="22" font-style="italic" fill="#57534e">output</text>
  </g>
  <text x="885" y="446" text-anchor="middle" font-size="24" font-style="italic" fill="#57534e">Human attention gates progress</text>

  <!-- ============ (c) Governance-centric: env box (bottom-center, the synthesis) ============ -->
  <text x="590" y="606" text-anchor="middle" font-size="38" font-weight="700" fill="#1c1917">(c) Governance-centric</text>
  <g font-size="28" fill="#1c1917">
    <text x="452" y="674" text-anchor="middle" font-weight="700">Human</text>

    <rect x="518" y="638" width="272" height="150" rx="8" fill="none" stroke="#2f5169" stroke-width="2"/>
    <text x="654" y="670" text-anchor="middle" font-size="24" fill="#2f5169">Governed</text>
    <text x="654" y="696" text-anchor="middle" font-size="24" fill="#2f5169">engineering</text>
    <text x="654" y="720" text-anchor="middle" font-size="24" fill="#2f5169">environment</text>
    <rect x="584" y="726" width="140" height="46" rx="4" fill="none" stroke="#1c1917" stroke-width="1.4"/>
    <text x="654" y="756" text-anchor="middle" font-size="24">Agent</text>

    <g fill="none" stroke="#1c1917" stroke-width="1.5" marker-end="url(#omArrow)">
      <path d="M452,686 L452,738 L512,738"/>
    </g>
    <text x="460" y="770" text-anchor="middle" font-size="22" font-style="italic" fill="#57534e">policies</text>
  </g>
  <text x="590" y="806" text-anchor="middle" font-size="24" font-style="italic" fill="#2f5169">Known policies become controls</text>
</svg>
