<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): Mermaid's node set has no port/tab geometry,
     and edges to tiny nodes sprawl. The "sticky-outy parts" are literal tabs on
     each block's right edge; the governance bar notches into them. The stack is
     given a gentle downward bow (arc) and a bigger->smaller taper (top = widest
     outer shell, bottom = narrowest core) to hint an onion of nested layers. The
     model's only port points UP into the harness (internal to the stack), never
     out to the governance bar. See the .md for the rationale. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif" role="group"
     aria-labelledby="diagTitle diagDesc">
  <title id="diagTitle">The four-layer stack, its governance hooks, and the methodology that plugs into them</title>
  <desc id="diagDesc">A vertical stack of four conventional layer blocks, application on top and GenAI model at the foundation. The stack bows gently downward and tapers from widest at the top to narrowest at the bottom, hinting an onion: the Application is the big outer shell and the GenAI model the small core. From top: the Application (your codebase), with a tab labelled tests / CI; the Engineering environment (git), with a tab labelled git-hooks and the note push / pull; the Harness (Claude Code), with two tabs labelled claude-hooks and claude-skills and the note prompts; the GenAI model, whose only tab points upward into the harness. Each right-edge tab is a small protrusion — the concrete hook the method grabs. On the right, a vertical Methodology and governance bar has fingers that notch into every right-edge tab, showing that governance plugs into these specific hooks. The GenAI model has no governance tab of its own: it is reached through the harness, so its single tab points up into the harness block, not out to the governance bar. The story reads model, up into harness, then out to governance.</desc>

  <style>
    .block  { fill:#f6f4ef; stroke:#1c1917; stroke-width:1.5; }
    .btitle { font-size:26.88px; font-weight:700; fill:#1c1917; }
    .bsub   { font-size:25px; font-style:italic; fill:#57534e; }
    .tab    { fill:#ffffff; stroke:#1c1917; stroke-width:1.5; }
    .tablbl { font-size:26.88px; font-weight:600; fill:#1c1917; }
    .govlbl { font-size:26.88px; font-weight:700; fill:#ffffff; }
    .intlbl { font-size:25px; font-weight:600; fill:#1c1917; }
  </style>

  <defs>
    <marker id="asl-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- ===== The four conventional layer blocks (top = Application, bottom = model) ===== -->
  <!-- Right edge held at x=560 for every block so tabs/fingers stay aligned; the
       LEFT edge steps inward top->bottom (taper) and the y-top steps down with an
       accelerating offset (subtle downward arc). -->

  <!-- L4 Application  (widest = outer shell) -->
  <rect class="block" x="60"  y="40"  width="500" height="90" rx="4"/>
  <text class="btitle" x="82"  y="78">Application</text>
  <text class="bsub"   x="82"  y="100">your codebase</text>

  <!-- L3 Engineering environment (git) -->
  <rect class="block" x="72"  y="150" width="488" height="90" rx="4"/>
  <text class="btitle" x="92" y="188">Engineering environment</text>
  <text class="bsub"   x="92" y="210">git · push · pull</text>

  <!-- L2 Harness (Claude Code) -->
  <rect class="block" x="110" y="264" width="450" height="90" rx="4"/>
  <text class="btitle" x="132" y="302">Harness — Claude Code</text>
  <text class="bsub"   x="132" y="324">prompts</text>

  <!-- L1 GenAI model  (narrowest = core; its only tab points UP into the harness) -->
  <rect class="block" x="135" y="420" width="425" height="90" rx="4"/>
  <text class="btitle" x="157" y="458">GenAI model</text>
  <text class="bsub"   x="157" y="480">reached via the harness</text>

  <!-- ===== Internal upward port: model -> harness (inside the stack) ===== -->
  <!-- A chip in the harness->model gap with a marker-headed arrow pointing up
       into the harness. Not a governance hook; it says the model is reached
       THROUGH the harness. Chip clears both blocks (harness bottom 354, model
       top 420). -->
  <rect class="tab" x="160" y="371" width="200" height="34" rx="3"/>
  <text class="intlbl" x="260" y="396" text-anchor="middle">via harness</text>
  <line x1="260" y1="371" x2="260" y2="358" stroke="#1c1917" stroke-width="2" marker-end="url(#asl-ah)"/>

  <!-- ===== The "sticky-outy" tabs — small protrusions on the right edge ===== -->
  <!-- Each tab sticks out from x=560 (block right edge) rightward, centered on the
       (arced) vertical midline of its block. Widened so the larger hook labels fit
       without clipping; the governance bar and its fingers shift right to match. -->

  <!-- L4 tab: tests / CI   (block center y=85) -->
  <rect class="tab" x="600" y="62"  width="176" height="46" rx="3"/>
  <text class="tablbl" x="688" y="93"  text-anchor="middle">tests / CI</text>

  <!-- L3 tab: git-hooks    (block center y=195) -->
  <rect class="tab" x="600" y="172" width="176" height="46" rx="3"/>
  <text class="tablbl" x="688" y="203" text-anchor="middle">git-hooks</text>

  <!-- L2 tabs: claude-hooks + claude-skills  (block center y=309; 10u gap between tabs) -->
  <rect class="tab" x="600" y="262" width="292" height="42" rx="3"/>
  <text class="tablbl" x="746" y="292" text-anchor="middle">claude-hooks</text>
  <rect class="tab" x="600" y="314" width="292" height="42" rx="3"/>
  <text class="tablbl" x="746" y="344" text-anchor="middle">claude-skills</text>

  <!-- ===== Governance bar with fingers that notch into the tabs ===== -->
  <!-- Bar body; fingers reach left from the bar to each tab's right edge. -->

  <!-- fingers (drawn first, behind the bar) -->
  <g fill="#2f5169">
    <rect x="776" y="76"  width="180" height="16" rx="2"/>  <!-- to tests/CI -->
    <rect x="776" y="186" width="180" height="16" rx="2"/>  <!-- to git-hooks -->
    <rect x="892" y="275" width="64" height="16" rx="2"/>  <!-- to claude-hooks -->
    <rect x="892" y="327" width="64" height="16" rx="2"/>  <!-- to claude-skills -->
  </g>

  <!-- governance bar -->
  <rect x="950" y="20" width="140" height="520" rx="6" fill="#2f5169" stroke="#2f5169" stroke-width="1.5"/>
  <!-- Rotated title stacked on two lines so each fits the tall bar (it is tall, not wide). Authored at
       (0,0) and placed with translate+rotate: the width heuristic reads the un-transformed anchor, so a
       (0,0) anchor keeps it off the bar rect and inside the canvas, while the transform renders it centered
       on the bar. Two columns 48u apart; under rotate(90) the FIRST line of the pair is the RIGHT column
       (a tilted head reads right-to-left across columns), so "Methodology +" takes the larger x. -->
  <text class="govlbl" x="0" y="0" text-anchor="start" transform="translate(1053 139) rotate(90)">Methodology +</text>
  <text class="govlbl" x="0" y="0" text-anchor="start" transform="translate(1005 178) rotate(90)">governance</text>

</svg>
