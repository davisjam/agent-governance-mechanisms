<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: mage-staircase).
     The five-rung climb from Co-coder to Architect: each rung is a role and the state of the
     system there; between rungs, the shortcoming that forced the next step. The top rung —
     explicit models held honest by a traceability substrate — is MAGE. Palette: Umber
     Monograph tokens (fleet #2f5169 rungs, churn #b23b3b shortcomings,
     governed #1f7a4d + accent #9a3f12 the summit). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 815" width="1180" height="815"
     role="group" aria-labelledby="mgTitle mgDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mgTitle">The five-rung staircase from Co-coder to Architect — the top rung is MAGE</title>
  <desc id="mgDesc">A five-rung staircase climbing left to right. Rung one, Co-coder: I read
    every diff and merge by hand — the human is the quality gate. Its shortcoming, a review
    queue one human cannot clear, forces rung two, QA: one agent audits the work; review has
    left my hands. Its shortcoming — one generalist audit cannot rank findings or tell one
    part of the code from another — forces rung three, Review Lead: specialist audits run per
    zone; findings aimed and ranked, the deterministic half becoming lints. Its shortcoming —
    a finite-context agent cannot hold the whole codebase — forces rung four, Tech Lead: the
    code is partitioned into named zones and an agent reasons inside one, fenced from the
    rest. Its shortcoming — hardcoded facts rot, and the growing set of models drifts into
    stale ghosts — forces rung five, Architect: the system is committed to explicit models,
    one view per property, held honest by a traceability substrate. Together they are MAGE.
    The ladder ends at Architect.</desc>

  <defs>
    <marker id="mg-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="mg-ah-churn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <!-- ===== rung 1 · Co-coder ===== -->
  <rect x="10" y="650" width="228" height="150" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="124" y="684" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">1 · Co-coder</text>
  <text x="124" y="712" text-anchor="middle" font-size="18.88" fill="#57534e">I read every diff and</text>
  <text x="124" y="734" text-anchor="middle" font-size="18.88" fill="#57534e">merge by hand — the</text>
  <text x="124" y="756" text-anchor="middle" font-size="17.95" fill="#57534e">human is the quality gate</text>

  <!-- shortcoming 1 -->
  <line x1="242" y1="720" x2="281" y2="720" stroke="#1c1917" stroke-width="2.5" marker-end="url(#mg-ah)"/>
  <rect x="285" y="670" width="205" height="134" rx="6" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.5"/>
  <text x="387" y="698" text-anchor="middle" font-size="18.88" font-style="italic" font-weight="600" fill="#b23b3b">the shortcoming</text>
  <text x="387" y="732" text-anchor="middle" font-size="18.88" fill="#57534e">a review queue one</text>
  <text x="387" y="754" text-anchor="middle" font-size="18.88" fill="#57534e">human cannot clear</text>
  <line x1="387" y1="666" x2="387" y2="644" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mg-ah-churn)"/>
  <text x="399" y="658" font-size="18.88" font-style="italic" fill="#b23b3b">forces</text>

  <!-- ===== rung 2 · QA ===== -->
  <rect x="241" y="490" width="228" height="150" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="355" y="524" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">2 · QA</text>
  <text x="355" y="552" text-anchor="middle" font-size="18.88" fill="#57534e">one agent audits the</text>
  <text x="355" y="574" text-anchor="middle" font-size="18.88" fill="#57534e">work; review has</text>
  <text x="355" y="596" text-anchor="middle" font-size="18.88" fill="#57534e">left my hands</text>

  <!-- shortcoming 2 -->
  <line x1="473" y1="570" x2="512" y2="570" stroke="#1c1917" stroke-width="2.5" marker-end="url(#mg-ah)"/>
  <rect x="516" y="510" width="205" height="134" rx="6" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.5"/>
  <text x="618" y="536" text-anchor="middle" font-size="18.88" font-style="italic" font-weight="600" fill="#b23b3b">the shortcoming</text>
  <text x="618" y="560" text-anchor="middle" font-size="18.88" fill="#57534e">one generalist audit</text>
  <text x="618" y="580" text-anchor="middle" font-size="18.88" fill="#57534e">cannot rank findings</text>
  <text x="618" y="600" text-anchor="middle" font-size="18.88" fill="#57534e">or tell one part of the</text>
  <text x="618" y="620" text-anchor="middle" font-size="18.88" fill="#57534e">code from another</text>
  <line x1="618" y1="506" x2="618" y2="486" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mg-ah-churn)"/>
  <text x="630" y="500" font-size="18.88" font-style="italic" fill="#b23b3b">forces</text>

  <!-- ===== rung 3 · Review Lead ===== -->
  <rect x="472" y="330" width="228" height="150" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="586" y="364" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">3 · Review Lead</text>
  <text x="586" y="392" text-anchor="middle" font-size="18.88" fill="#57534e">specialist audits run per</text>
  <text x="586" y="414" text-anchor="middle" font-size="18.13" fill="#57534e">zone; findings aimed and</text>
  <text x="586" y="436" text-anchor="middle" font-size="18" fill="#57534e">ranked; the deterministic</text>
  <text x="586" y="458" text-anchor="middle" font-size="18.88" fill="#57534e">half become lints</text>

  <!-- shortcoming 3 -->
  <line x1="704" y1="410" x2="743" y2="410" stroke="#1c1917" stroke-width="2.5" marker-end="url(#mg-ah)"/>
  <rect x="747" y="350" width="205" height="134" rx="6" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.5"/>
  <text x="849" y="380" text-anchor="middle" font-size="18.88" font-style="italic" font-weight="600" fill="#b23b3b">the shortcoming</text>
  <text x="849" y="410" text-anchor="middle" font-size="18.88" fill="#57534e">a finite-context agent</text>
  <text x="849" y="430" text-anchor="middle" font-size="18.88" fill="#57534e">cannot hold the</text>
  <text x="849" y="450" text-anchor="middle" font-size="18.88" fill="#57534e">whole codebase</text>
  <line x1="850" y1="346" x2="850" y2="324" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mg-ah-churn)"/>
  <text x="862" y="340" font-size="18.88" font-style="italic" fill="#b23b3b">forces</text>

  <!-- ===== rung 4 · Tech Lead ===== -->
  <rect x="703" y="170" width="228" height="150" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="817" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">4 · Tech Lead</text>
  <text x="817" y="232" text-anchor="middle" font-size="18.88" fill="#57534e">the code is partitioned</text>
  <text x="817" y="254" text-anchor="middle" font-size="18.88" fill="#57534e">into named zones. An</text>
  <text x="817" y="276" text-anchor="middle" font-size="17.88" fill="#57534e">agent reasons inside one,</text>
  <text x="817" y="298" text-anchor="middle" font-size="18.88" fill="#57534e">fenced from the rest</text>

  <!-- shortcoming 4 -->
  <line x1="935" y1="270" x2="954" y2="270" stroke="#1c1917" stroke-width="2.5" marker-end="url(#mg-ah)"/>
  <rect x="958" y="230" width="205" height="134" rx="6" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.5"/>
  <text x="1060" y="256" text-anchor="middle" font-size="18.88" font-style="italic" font-weight="600" fill="#b23b3b">the shortcoming</text>
  <text x="1060" y="280" text-anchor="middle" font-size="18.88" fill="#57534e">hardcoded facts rot;</text>
  <text x="1060" y="300" text-anchor="middle" font-size="18.88" fill="#57534e">the growing set of</text>
  <text x="1060" y="320" text-anchor="middle" font-size="18.88" fill="#57534e">models drifts into</text>
  <text x="1060" y="340" text-anchor="middle" font-size="18.88" fill="#57534e">stale ghosts</text>
  <line x1="1060" y1="226" x2="1060" y2="204" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mg-ah-churn)"/>
  <text x="1072" y="220" font-size="18.88" font-style="italic" fill="#b23b3b">forces</text>

  <!-- ===== rung 5 · Architect — the summit ===== -->
  <rect x="934" y="6" width="228" height="194" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="1048" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">5 · Architect</text>
  <text x="1048" y="66" text-anchor="middle" font-size="18.48" fill="#57534e">the system is committed</text>
  <text x="1048" y="88" text-anchor="middle" font-size="18.88" fill="#57534e">to explicit models, one</text>
  <text x="1048" y="110" text-anchor="middle" font-size="18.88" fill="#57534e">view per property, held</text>
  <text x="1048" y="132" text-anchor="middle" font-size="18.88" fill="#57534e">honest by a traceability</text>
  <text x="1048" y="154" text-anchor="middle" font-size="18.88" fill="#57534e">substrate</text>
  <text x="1048" y="182" text-anchor="middle" font-size="18.19" font-weight="700" fill="#9a3f12">together they are MAGE</text>
</svg>
