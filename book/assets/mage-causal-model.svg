<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-causal-model). The MAGE Causal Model, drawn in the
     Accelerate path-diagram idiom (labelled boxes, single-headed arrows read "drives /
     therefore"). One exogenous driver (agentic velocity) feeds two capability boxes
     (modeling investment, governance conversion); both load onto one latent intermediate,
     governed environment quality (E); E produces three outcomes (sustained throughput,
     falling defect-escape, bounded oversight cost). The dominant relation is a dashed
     moderation edge from velocity across to the outcomes, its sign set by E where a diamond
     marks the crossing: negative (churn) when E is low, positive (durable) when E is high.
     Two dotted scope-condition gates below — capability-fit and authority — gate the
     capabilities. Each construct carries its dashboard observable. Palette: Umber Monograph
     tokens (ink #1c1917, fleet #2f5169 driver, governed #1f7a4d capabilities/E, accent
     #9a3f12 outcomes + observables, churn #b23b3b low-E sign, muted #57534e conditions,
     rule #e4e0d8). Fonts >= 17u so every label clears the book body size at render width. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560"
     role="img" aria-labelledby="t1Title t1Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="t1Title">The MAGE Causal Model</title>
  <desc id="t1Desc">A left-to-right causal path diagram. On the left, one exogenous driver,
    Agentic velocity — the fleet, which exposes failure; its observable is velocity and churn.
    Velocity drives two stacked capability boxes: Modeling investment (the Modeling Thesis,
    keeping the map equal to the territory; observable model-sync metric) and Governance
    conversion (the Alignment Thesis, turning a failure class into a durable control;
    observable control growth). Both capabilities load onto one latent intermediate box,
    Governed environment quality E — map equals territory plus mechanized coverage; observable
    support ratio. E drives three stacked outcome boxes on the right, grouped as Velocity,
    Quality, and Sustainability: Sustained throughput, a Falling defect-escape rate, and
    Bounded oversight cost. The visually dominant relation is a dashed moderation edge running
    from Agentic velocity across the top to the outcomes; a diamond marks where it crosses over
    E, labelled: the sign of velocity's effect is set by E — negative churn when E is low,
    positive durable throughput when E is high. Two dotted scope-condition gates below the
    capabilities, Capability-fit and Authority, gate the two capabilities. The model is drawn
    from one repository over roughly twenty weeks; the arrows are directional, not fitted.</desc>

  <defs>
    <marker id="t1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="t1-ah-mod" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="t1-ah-open" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#57534e" stroke-width="1.6"/>
    </marker>
    <marker id="t1-diamond" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="15" markerHeight="15">
      <path d="M6,0.5 L11.5,6 L6,11.5 L0.5,6 z" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- ============ MODERATION EDGE (the theory; drawn first, sits behind boxes) ============ -->
  <!-- dashed arc: velocity (top) sweeping across to the outcome group, curving over E.
       Rises steeply at far left so it clears the moderation label band. -->
  <path d="M100,150 C100,58 175,36 320,34 C480,32 620,58 668,118"
        fill="none" stroke="#9a3f12" stroke-width="3" stroke-dasharray="9 6"
        marker-end="url(#t1-ah-mod)"/>
  <!-- E's arrow up onto the moderation edge, diamond marks the crossing above E.
       The label band sits LEFT of this x=535 corridor so the arrow never crosses a glyph. -->
  <path d="M535,170 L535,46" fill="none" stroke="#9a3f12" stroke-width="2.2"
        stroke-dasharray="4 4" marker-end="url(#t1-diamond)"/>
  <text x="300" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3f12">velocity's effect: sign set by E</text>
  <text x="300" y="79" text-anchor="middle" font-size="18" fill="#b23b3b">&#8722; churn when E low<tspan fill="#57534e">&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#1f7a4d">+ durable when E high</tspan></text>

  <!-- ============ CONNECTOR ARROWS (drives / therefore) ============ -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <path d="M187,196 L223,158" marker-end="url(#t1-ah)"/>   <!-- velocity -> modeling -->
    <path d="M187,244 L223,318" marker-end="url(#t1-ah)"/>   <!-- velocity -> governance -->
    <path d="M410,158 L446,224" marker-end="url(#t1-ah)"/>   <!-- modeling -> E -->
    <path d="M410,320 L446,296" marker-end="url(#t1-ah)"/>   <!-- governance -> E -->
    <path d="M623,236 L658,158" marker-end="url(#t1-ah)"/>   <!-- E -> sustained -->
    <path d="M623,260 L658,279" marker-end="url(#t1-ah)"/>   <!-- E -> falling -->
    <path d="M623,284 L658,405" marker-end="url(#t1-ah)"/>   <!-- E -> bounded -->
  </g>

  <!-- ============ SCOPE-CONDITION GATES (dotted, open heads) ============ -->
  <g stroke="#57534e" stroke-width="1.8" fill="none" stroke-dasharray="2 4">
    <path d="M232,415 L272,392" marker-end="url(#t1-ah-open)"/>  <!-- fit -> governance -->
    <path d="M196,415 C150,330 150,250 232,206" marker-end="url(#t1-ah-open)"/> <!-- fit -> modeling -->
    <path d="M420,415 L360,392" marker-end="url(#t1-ah-open)"/>  <!-- authority -> governance -->
  </g>

  <!-- ============ DRIVER (Col A, fleet) ============ -->
  <rect x="12" y="150" width="175" height="140" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="99" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Agentic</text>
  <text x="99" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">velocity</text>
  <text x="99" y="242" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">exposes failure</text>
  <text x="99" y="272" text-anchor="middle" font-size="17" font-style="italic" fill="#9a3f12">velocity &#183; churn</text>

  <!-- ============ CAPABILITIES (Col B, governed) ============ -->
  <rect x="225" y="88" width="185" height="132" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="317" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Modeling</text>
  <text x="317" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">investment</text>
  <text x="317" y="176" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">Modeling Thesis:</text>
  <text x="317" y="195" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">map &#8801; territory</text>
  <text x="317" y="214" text-anchor="middle" font-size="17" font-style="italic" fill="#9a3f12">model-sync metric</text>

  <rect x="225" y="252" width="185" height="132" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="317" y="290" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Governance</text>
  <text x="317" y="314" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">conversion</text>
  <text x="317" y="340" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">Alignment Thesis:</text>
  <text x="317" y="359" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">failure &#8594; control</text>
  <text x="317" y="378" text-anchor="middle" font-size="17" font-style="italic" fill="#9a3f12">control growth</text>

  <!-- ============ INTERMEDIATE E (Col C, governed, the hub) ============ -->
  <rect x="448" y="170" width="175" height="180" rx="9" fill="#dff0e6" stroke="#1f7a4d" stroke-width="3"/>
  <text x="535" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Governed</text>
  <text x="535" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">environment</text>
  <text x="535" y="264" text-anchor="middle" font-size="22" font-weight="700" fill="#1f7a4d">quality (E)</text>
  <text x="535" y="290" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">map &#8801; territory</text>
  <text x="535" y="309" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">+ mechanized cover</text>
  <text x="535" y="335" text-anchor="middle" font-size="17" font-style="italic" fill="#9a3f12">support ratio</text>

  <!-- ============ OUTCOMES (Col D, accent) with Velocity/Quality/Sustainability kickers ==== -->
  <rect x="660" y="95" width="188" height="112" rx="9" fill="#f5e7dc" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="754" y="121" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#9a3f12">VELOCITY</text>
  <text x="754" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Sustained</text>
  <text x="754" y="174" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">throughput</text>
  <text x="754" y="197" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">near-linear rate</text>

  <rect x="660" y="223" width="188" height="112" rx="9" fill="#f5e7dc" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="754" y="249" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#9a3f12">QUALITY</text>
  <text x="754" y="278" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Falling</text>
  <text x="754" y="302" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">defect-escape</text>
  <text x="754" y="325" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">claim coverage</text>

  <rect x="660" y="351" width="188" height="112" rx="9" fill="#f5e7dc" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="754" y="377" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.5" fill="#9a3f12">SUSTAINABILITY</text>
  <text x="754" y="406" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Bounded</text>
  <text x="754" y="430" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">oversight cost</text>
  <text x="754" y="453" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">support ratio</text>

  <!-- ============ GATE BOXES (conditions, not drivers) ============ -->
  <rect x="150" y="415" width="180" height="78" rx="8" fill="#f2efe9" stroke="#57534e" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="240" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#57534e">Capability-fit</text>
  <text x="240" y="474" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">scope condition</text>

  <rect x="352" y="415" width="150" height="78" rx="8" fill="#f2efe9" stroke="#57534e" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="427" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#57534e">Authority</text>
  <text x="427" y="474" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">scope condition</text>
</svg>
