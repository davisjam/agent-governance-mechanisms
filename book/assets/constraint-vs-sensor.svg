<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): a two-way fork with a distinct icon per arm
     (a constraint that makes the class impossible vs. a sensor that detects a mistake that
     already happened). Mermaid's flowchart would draw the fork but not the
     forbid-before / detect-after contrast that is the whole point; the side-by-side
     "firewall vs. smoke detector" framing wants bespoke placement. Accent #2f5169. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440"
     role="group" aria-labelledby="caTitle caDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="caTitle">Two forms a quality goal splits into: a constraint or a sensor</title>
  <desc id="caDesc">A quality goal you want to hold splits into two moves — prevent the mistake, or
    catch it — however you arrived at the goal, up front from the domain or in response to a failure.
    On the left, a constraint: it makes the whole class of mistake impossible by scoping the action space,
    like choosing a typed enumeration over free-form strings so an unlisted value cannot be represented,
    like a firewall. On the right, a sensor: it lets the mistake happen but detects it and surfaces it
    in time to stop the damage, like a test suite in CI or a smoke detector. The wall forbids the bug;
    the sensor watches for it. The wall is cheaper to live behind than the sensor is to keep reading.</desc>

  <defs>
    <marker id="caArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- source: quality goal -->
  <rect x="330" y="30" width="300" height="66" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="480" y="63" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Quality goal</text>
  <text x="480" y="88" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">prevent the mistake, or catch it</text>

  <!-- fork edges -->
  <g fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#caArrow)">
    <path d="M400,96 C360,128 300,132 250,158"/>
    <path d="M560,96 C600,128 660,132 710,158"/>
  </g>

  <!-- ================= LEFT — constraint / wall ================= -->
  <rect x="70" y="164" width="360" height="228" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="250" y="200" text-anchor="middle" font-size="27" font-weight="700" fill="#2f5169">Constraint — prevents</text>

  <!-- wall icon: brick courses -->
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <rect x="216" y="230" width="68" height="44"/>
    <line x1="216" y1="252" x2="284" y2="252"/>
    <line x1="250" y1="230" x2="250" y2="252"/>
    <line x1="233" y1="252" x2="233" y2="274"/>
    <line x1="267" y1="252" x2="267" y2="274"/>
  </g>

  <text x="250" y="312" text-anchor="middle" font-size="20" fill="#1c1917">Makes the whole class</text>
  <text x="250" y="337" text-anchor="middle" font-size="20" fill="#1c1917">of mistake impossible.</text>
  <text x="250" y="372" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">typed enum over strings · firewall</text>

  <!-- ================= RIGHT — sensor / detector ================= -->
  <rect x="530" y="164" width="360" height="228" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="710" y="200" text-anchor="middle" font-size="27" font-weight="700" fill="#2f5169">Sensor — detects</text>

  <!-- sensor icon: a dish detecting a spark -->
  <circle cx="710" cy="252" r="26" fill="none" stroke="#2f5169" stroke-width="2.5"/>
  <circle cx="710" cy="252" r="6" fill="#2f5169"/>
  <path d="M710,226 A26,26 0 0,1 736,252" fill="none" stroke="#b23b3b" stroke-width="3"/>

  <text x="710" y="312" text-anchor="middle" font-size="20" fill="#1c1917">Lets the mistake happen,</text>
  <text x="710" y="337" text-anchor="middle" font-size="20" fill="#1c1917">detects it before it ships.</text>
  <text x="710" y="372" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">test suite in CI · smoke detector</text>
</svg>
