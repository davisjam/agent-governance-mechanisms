<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the provenance + fidelity flagship stack as one left-to-right
     pipeline. Two lanes: the sanctioned door (fleet blue — MARK the insert, EMIT the stamp) and the
     guarantee (governed green — COVER the verb set, READ the history back, GATE what leaves). Below the
     row, the artifact strip carries the embedded stamps EMIT drops and READ + GATE consume; a red chip at
     the exit names the per-pass fidelity signal. Mermaid can draw the flow but not keep the two lanes in
     register with the artifact strip and the stamp drops. Palette: Umber Monograph tokens (fleet
     #2f5169/#e7edf3, governed #1f7a4d/#e3f0e7, accent #9a3f12, churn #b23b3b/#fbeaea, ink #1c1917,
     muted #57534e, panel #f6f4ef, rule #e4e0d8). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470"
     role="group" aria-labelledby="pfTitle pfDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="pfTitle">The provenance + fidelity stack: mark it, cover the marking, read it back, gate what leaves</title>
  <desc id="pfDesc">A document flows left to right through five stages in two lanes. The sanctioned-door
    lane, fleet blue: MARK (the a11y-prefix naming rule) names every insertion so it is registry-covered;
    EMIT (the mutator stamps) writes an attribution stamp for every mutation into the artifact. The
    guarantee lane, governed green: COVER (the wiring lint) asserts every mutator verb is wired, holding the
    closed verb set at zero gaps; READ (the derive-changelog command) reconstructs the mutation history from
    the embedded stamps; GATE (the content validator) asserts the input's content survives into the output
    and fails the job otherwise, with a per-pass signal that names which pass dropped content. Below the
    row, an artifact strip carries the embedded stamps that EMIT drops in and READ and GATE read back —
    provenance you can reconstruct from the artifact itself.</desc>

  <defs>
    <marker id="pfArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- input cap -->
  <text x="60" y="180" text-anchor="middle" font-size="19.2" font-weight="700" fill="#57534e">a</text>
  <text x="60" y="198" text-anchor="middle" font-size="19.2" font-weight="700" fill="#57534e">document</text>

  <!-- ============ lane bands ============ -->
  <text x="118" y="104" font-size="19.2" font-weight="700" fill="#2f5169">the sanctioned door — every mutation routes through here</text>
  <rect x="112" y="116" width="404" height="132" rx="12" fill="none" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>

  <text x="1108" y="104" text-anchor="end" font-size="19.2" font-weight="700" fill="#1f7a4d">the guarantee — complete provenance · caught fidelity loss</text>
  <rect x="520" y="116" width="590" height="132" rx="12" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- ============ stage boxes ============ -->
  <!-- MARK · a11y-prefix (door) -->
  <rect x="130" y="140" width="180" height="86" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="220" y="176" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">MARK</text>
  <text x="220" y="202" text-anchor="middle" font-size="19.2" font-weight="600" fill="#2f5169">a11y-prefix</text>

  <!-- EMIT · mutator-stamps (door) -->
  <rect x="328" y="140" width="180" height="86" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="418" y="176" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">EMIT</text>
  <text x="418" y="202" text-anchor="middle" font-size="19.2" font-weight="600" fill="#2f5169">mutator-stamps</text>

  <!-- COVER · f10-wiring-lint (guarantee) -->
  <rect x="526" y="140" width="180" height="86" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="616" y="176" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">COVER</text>
  <text x="616" y="202" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1f7a4d">f10-wiring-lint</text>

  <!-- READ · derive-changelog (guarantee) -->
  <rect x="724" y="140" width="180" height="86" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="814" y="176" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">READ</text>
  <text x="814" y="202" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1f7a4d">derive-changelog</text>

  <!-- GATE · content-validator (guarantee) -->
  <rect x="922" y="140" width="180" height="86" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="1012" y="176" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">GATE</text>
  <text x="1012" y="202" text-anchor="middle" font-size="18.75" font-weight="600" fill="#1f7a4d">content-validator</text>

  <!-- ============ per-stage role glosses (free-floating, below the bands) ============ -->
  <g font-size="19.2" font-style="italic" fill="#57534e" text-anchor="middle">
    <text x="220" y="274">name every insertion</text>
    <text x="418" y="274">stamp every mutation</text>
    <text x="616" y="274">wire the whole verb set</text>
    <text x="814" y="274">reconstruct the history</text>
    <text x="1012" y="274">assert input &#8838; output</text>
  </g>

  <!-- ============ the artifact strip (embedded evidence) ============ -->
  <text x="306" y="336" font-size="19.2" font-weight="700" fill="#57534e">the artifact — evidence embedded in the file</text>
  <rect x="300" y="346" width="802" height="40" rx="6" fill="#f6f4ef" stroke="#e4e0d8" stroke-width="1.5"/>
  <!-- embedded stamps -->
  <g fill="#9a3f12">
    <path d="M360,356 l7,10 l-7,10 l-7,-10 z"/>
    <path d="M470,356 l7,10 l-7,10 l-7,-10 z"/>
    <path d="M580,356 l7,10 l-7,10 l-7,-10 z"/>
    <path d="M690,356 l7,10 l-7,10 l-7,-10 z"/>
    <path d="M800,356 l7,10 l-7,10 l-7,-10 z"/>
  </g>
  <text x="1015" y="371" text-anchor="middle" font-size="19.2" font-style="italic" fill="#9a3f12">stamps = provenance</text>

  <!-- ============ per-pass fidelity signal (churn chip under GATE) ============ -->
  <rect x="940" y="286" width="150" height="34" rx="6" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.5"/>
  <text x="1015" y="308" text-anchor="middle" font-size="15.92" font-weight="600" fill="#b23b3b">pass N dropped it</text>

  <!-- ============ arrows ============ -->
  <g fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#pfArrow)">
    <path d="M92,189 L128,189"/>
    <path d="M310,183 L326,183"/>
    <path d="M508,183 L524,183"/>
    <path d="M706,183 L722,183"/>
    <path d="M904,183 L920,183"/>
    <!-- EMIT drops stamps into the artifact strip -->
    <path d="M418,228 L418,344"/>
    <!-- READ reads the stamps back out of the strip -->
    <path d="M814,344 L814,228"/>
  </g>
  <!-- GATE exit -->
  <g fill="none" stroke="#9a3f12" stroke-width="2.4" marker-end="url(#pfArrow)">
    <path d="M1102,189 L1150,189 L1150,410"/>
  </g>
  <text x="1150" y="432" text-anchor="middle" font-size="19.2" font-weight="700" fill="#9a3f12">ships —</text>
  <text x="1150" y="450" text-anchor="middle" font-size="19.2" font-weight="700" fill="#9a3f12">history intact</text>

  <!-- small labels on the vertical stamp arrows -->
  <text x="428" y="290" font-size="19.2" font-style="italic" fill="#57534e">drops</text>
  <text x="758" y="290" font-size="19.2" font-style="italic" fill="#57534e">reads back</text>
</svg>
